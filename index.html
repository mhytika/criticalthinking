/* ===== Design „Textmarker“ – KI kritisch denken ===== */
:root{
--paper:#FAF9F6;--card:#FFFFFF;--ink:#2A2623;--ink2:#47403C;--muted:#6D6766;--faint:#918C8C;--line:#E6E2DC;--line2:#D3CEC7;--wash:#F2F0EC;
--hl:#FFFC00;--hl2:#FFFE9E;
--gk:#094954;--gkl:#E5F1F2;--wbs:#6B108C;--wbsl:#F3E9F8;--ac:var(--gk);--acl:var(--gkl);
--ok:#1E6E36;--okb:#E8F4EC;--er:#B3261E;--erb:#FBECEA;--hi:#7A6200;--hib:#FFF8CC;
--t:#1F5F8B;--tb:#EAF2F8;--g:#A93226;--gb:#FBEDEB;--a:#1B6B3A;--ab:#E9F5EE;
--serif:"Bitter","BaWue Serif",Georgia,serif;--sans:"Source Sans 3","BaWue Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
--r:16px;--rs:10px;--sh:0 1px 2px rgba(42,38,35,.05),0 6px 18px -8px rgba(42,38,35,.12);--sh2:0 2px 4px rgba(42,38,35,.06),0 18px 40px -16px rgba(42,38,35,.22)}
body.f-wbs{--ac:var(--wbs);--acl:var(--wbsl)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default}
h1,h2,h3{font-family:var(--serif);line-height:1.15;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
mark,.hl{background-image:linear-gradient(100deg,transparent .6%,var(--hl) 1.6%,var(--hl) 98%,transparent 99.4%);background-repeat:no-repeat;background-size:100% 62%;background-position:0 88%;color:inherit;padding:0 .12em;margin:0 -.04em;border-radius:.2em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.draw{background-size:0 62%;animation:draw .9s .25s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{background-size:100% 62%}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.hl.draw{background-size:100% 62%}}

/* Kopfleiste */
.bar{position:sticky;top:0;z-index:50;height:62px;display:flex;align-items:center;gap:14px;padding:0 22px;background:rgba(250,249,246,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand .blk{width:10px;height:26px;background:var(--hl);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(42,38,35,.08)}
.crumb{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.bar .sp{flex:1}
.seg{display:inline-flex;background:var(--wash);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(42,38,35,.15)}
.seg button[aria-pressed=true].gk{color:var(--gk)}.seg button[aria-pressed=true].wbs{color:var(--wbs)}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--ink2);border:1px solid transparent}
.ghost:hover{background:var(--wash);border-color:var(--line)}
.menu{display:none}

/* Start */
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.hero{padding:64px 0 28px}
.kick{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;gap:10px;align-items:center}
.kick .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.hero h1{font-size:clamp(2.5rem,6.4vw,4.6rem);font-weight:800;letter-spacing:-.025em;max-width:16ch}
.hero p.lead{font-size:clamp(1.05rem,1.8vw,1.25rem);color:var(--ink2);max-width:58ch;margin-top:18px}
.pick{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:34px 0 18px}
.pick .lab{font-weight:700;font-size:.95rem}
.pick .seg button{padding:9px 18px;font-size:.95rem}
.tiles{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 28px 24px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s;min-height:250px;overflow:hidden}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--line2)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--wash);color:var(--ink)}
.tile .ic svg{width:24px;height:24px}
.tile h2{font-size:1.75rem;font-weight:800}
.tile p{color:var(--ink2);font-size:1rem;max-width:44ch}
.tile .meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--wash);color:var(--ink2);white-space:nowrap}
.tag.ac{background:var(--acl);color:var(--ac)}.tag.hl2{background:var(--hl);color:var(--ink)}.tag.dr{background:var(--hib);color:var(--hi)}
.tile .go{position:absolute;right:22px;top:24px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.tile:hover .go{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile .bar2{height:6px;border-radius:3px;background:var(--wash);overflow:hidden;flex:1;min-width:80px;max-width:160px}
.tile .bar2 i{display:block;height:100%;background:var(--ac)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:40px 0 10px}
.how div{border-top:2px solid var(--ink);padding-top:12px}
.how b{font-family:var(--serif);font-size:1.05rem;display:block;margin-bottom:4px}
.how p{color:var(--ink2);font-size:.95rem}
.foot{margin-top:56px;padding:22px 0 30px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center}
.foot button{padding:6px 0;text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}

/* Lab-Rahmen */
.labw{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1180px;margin:0 auto}
.rail{position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow:auto;padding:26px 18px 24px 26px;border-right:1px solid var(--line)}
.rail .rt{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.rail .rt:first-child{margin-top:0}
.st{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:10px;font-size:.93rem;color:var(--muted);position:relative}
.st:not(:disabled):hover{background:var(--wash);color:var(--ink)}
.st:disabled{color:var(--faint)}
.st i{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.74rem;font-weight:700;border:1.5px solid var(--line2);background:var(--card)}
.st.dn{color:var(--ink2)}.st.dn i{background:var(--ink);border-color:var(--ink);color:#fff}
.st.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--sh)}.st.on i{background:var(--hl);border-color:var(--ink);color:var(--ink)}
.prog{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--wash);overflow:hidden;margin:8px 0 12px}
.pbar i{display:block;height:100%;background:var(--ink);transition:width .4s}
.lnk{font-size:.84rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.lnk.warn{color:var(--er);font-weight:700}
.mob{display:none}
.shade{display:none}
.main{padding:34px 44px 60px;max-width:840px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);background:var(--acl);padding:4px 12px;border-radius:999px;margin-bottom:14px}
.main h1{font-size:clamp(1.9rem,3.6vw,2.6rem);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.ld{font-size:1.07rem;color:var(--ink2);margin-bottom:20px;max-width:62ch}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:12px 16px;margin-bottom:24px;box-shadow:inset 4px 0 0 var(--hl)}
.task .tl{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}
.cd{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:18px;box-shadow:var(--sh)}
.cd>h2,.cd .h2{font-size:1.25rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.cd>h2 .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--wash)}
.cd.lt>h2 .ico{background:var(--tb);color:var(--t)}.cd.lg>h2 .ico{background:var(--gb);color:var(--g)}.cd.la>h2 .ico{background:var(--ab);color:var(--a)}
.h3{font-size:1.08rem;font-weight:700;margin:22px 0 8px}
.info{background:var(--wash);border-radius:var(--rs);padding:12px 16px;margin-bottom:16px;font-size:.95rem;color:var(--ink2)}
.info p+p{margin-top:6px}.info strong{color:var(--ink)}
.q{font-weight:700;margin:18px 0 10px;font-size:1.02rem}
.q:first-child{margin-top:0}
.cap{font-size:.85rem;color:var(--muted);margin:-4px 0 12px}
.ki{background:var(--wash);border-radius:var(--rs);padding:16px 20px;margin-bottom:16px;font-size:1rem;line-height:1.7}
.ki small,.lab2{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ki p+p{margin-top:10px}
.ki.tap{background:var(--card);border:1px solid var(--line);line-height:2.05}
.sn{padding:3px 3px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .15s}
.sn[role=button]{cursor:pointer;background-image:linear-gradient(var(--line2),var(--line2));background-size:100% 2px;background-position:0 100%;background-repeat:no-repeat}
.sn[role=button]:hover,.sn[role=button]:focus-visible{background-color:var(--hl2);outline:none}
.sn.ok{background:linear-gradient(100deg,transparent 1%,var(--hl) 2%,var(--hl) 98%,transparent 99%);font-weight:600}
.sn.sol{background:var(--hib);box-shadow:inset 0 -2px 0 var(--hi);font-weight:600}
.sn.no{background:var(--erb);text-decoration:line-through;text-decoration-color:rgba(179,38,30,.55);text-decoration-thickness:2px}
details.fold{margin-bottom:14px}
details.fold>summary{display:inline-flex;align-items:center;gap:7px;cursor:pointer;list-style:none;border:1px solid var(--line2);border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:600;color:var(--ink2);background:var(--card)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{border-color:var(--ink)}
details.fold[open]>summary{margin-bottom:12px;background:var(--wash)}
details.plus{border:1.5px dashed var(--line2);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
details.plus>summary{border:0;padding:0;background:none!important;font-size:.98rem;color:var(--ink)}
details.plus>summary .tag{margin-left:2px}
details.plus>.cd{margin:12px 0 2px;box-shadow:none}

/* Antworten */
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:.98rem;transition:border-color .15s,background .15s,transform .15s}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted);margin-top:-1px}
.opt .tx{flex:1;min-width:0}
.opt .mk{flex:none;font-size:.74rem;font-weight:700;margin-left:6px;margin-top:3px;white-space:nowrap}
.opt:not(:disabled):hover{border-color:var(--ink);transform:translateX(2px)}
.opt:not(:disabled):hover .k{border-color:var(--ink);color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}.opt.ok .mk{color:var(--ok)}
.opt.no{border-color:var(--er);background:var(--erb)}.opt.no .k{background:var(--er);border-color:var(--er);color:#fff}.opt.no .mk{color:var(--er)}
.opt.sol{border-color:var(--hi);background:var(--hib)}.opt.sol .k{background:var(--hl);border-color:var(--ink);color:var(--ink)}.opt.sol .mk{color:var(--hi)}
.opt.off{opacity:.55}
.opt.mu[aria-pressed=true]{border-color:var(--ink);background:var(--wash)}
.opt.mu[aria-pressed=true] .k{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.mu.ok,.opt.mu.ok[aria-pressed=true]{border-color:var(--ok);background:var(--okb)}.opt.mu.no{border-color:var(--er);background:var(--erb)}
.fb{padding:12px 16px;border-radius:12px;margin:10px 0 16px;font-size:.96rem;border:1px solid}
.fb ul{margin:6px 0 0 18px}
.fok{background:var(--okb);border-color:#BFDCC8}.fer{background:var(--erb);border-color:#F1C7C2}.fhi{background:var(--hib);border-color:#EADC86}
.fb strong:first-child{margin-right:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-size:.92rem;font-weight:600;color:var(--ink2);transition:border-color .15s,background .15s}
.chip:not(:disabled):hover{border-color:var(--ink)}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.chip:disabled:not([aria-pressed=true]){opacity:.45}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.dot.g{background:#3E9B53}.dot.y{background:#F2D43A}.dot.r{background:#D9473B}
.kp{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--card);transition:background .2s,border-color .2s}
.kp p{margin-bottom:10px}
.kp.ag{background:#EEF7F0;border-color:#BCDCC4}.kp.ay{background:#FFFBE3;border-color:#ECDD8C}.kp.ar{background:#FCEFED;border-color:#EFC3BD}
.pos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pos .chip{justify-content:center;border-radius:12px;padding:10px 6px;text-align:center}
.fp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.fx{padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:.96rem;line-height:1.55;background:var(--wash)}
.fx b{display:block;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fx.v1{background:var(--gb);border-color:#EBC9C4}.fx.v1 b{color:var(--g)}
.fx.v2{background:var(--tb);border-color:#C7DAE8}.fx.v2 b{color:var(--t)}
.quote{font-family:var(--serif);font-size:1.15rem;line-height:1.45;padding:4px 0 4px 16px;border-left:3px solid var(--hl);margin-bottom:14px}
.wr{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.wr label{width:300px;font-size:.94rem;flex:none}
.wr input[type=range]{flex:1;min-width:120px;accent-color:var(--ink);height:30px}
.wv{width:30px;text-align:center;font-weight:800;font-family:var(--serif);font-size:1.15rem}
.wtot{text-align:right;font-size:.92rem;font-weight:700;margin-bottom:14px}
.wtot.bad{color:var(--er)}
.br2{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.br2>span:first-child{width:64px;font-size:.86rem;text-align:right;color:var(--ink2)}
.br2 .tk{flex:1;height:14px;background:var(--wash);border-radius:7px;overflow:hidden}
.br2 .fl{height:100%;border-radius:7px;transition:width .3s}
.br2>span:last-child{width:20px;text-align:center;font-size:.86rem;font-weight:700}
.bl{font-size:.88rem;font-weight:700;margin:14px 0 6px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.sc{padding:16px;border-radius:14px;background:var(--wash)}
.sc.t{background:var(--tb)}.sc.g{background:var(--gb)}.sc.a{background:var(--ab)}
.sc.t h2{color:var(--t)}.sc.g h2{color:var(--g)}.sc.a h2{color:var(--a)}
.sc h2{font-size:1rem;margin:8px 0 6px;display:flex;align-items:center;gap:8px}
.sc p{font-size:.9rem;color:var(--ink2)}
.cmp{display:grid;grid-template-columns:96px 1fr 1fr;gap:3px 14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem;align-items:baseline}
.cmp p{grid-column:2/-1;color:var(--ink2);font-size:.9rem}
.cmp .dot{display:inline-block;margin:0 3px 0 5px;vertical-align:-1px}
textarea,input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:.96rem;line-height:1.55;background:var(--card);color:var(--ink);resize:vertical}
textarea{min-height:130px;display:block}textarea.sm{min-height:70px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--hl2)}
input[type=text]{max-width:380px}
label.lb{font-weight:700;display:block;margin-bottom:6px;font-size:.96rem}
.chi{padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
.chi .q{margin-top:0}
.pbox{background:var(--wash);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;position:relative}
.pbox pre{font-family:var(--sans);font-size:.94rem;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;max-height:none}
.pbox pre strong.h{background:linear-gradient(100deg,transparent 1%,var(--hl2) 2%,var(--hl2) 98%,transparent 99%);padding:0 .1em}
.pbox .bar3{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-size:.96rem;font-weight:700;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.b1{background:var(--ink);color:#fff;box-shadow:0 4px 14px -6px rgba(42,38,35,.6)}
.b1:not(:disabled):hover{transform:translateY(-1px);background:#000}
.b2{background:var(--hl);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.b2:not(:disabled):hover{transform:translateY(-1px)}
.b3{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.b3:not(:disabled):hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{padding:7px 14px;font-size:.86rem}
.btn:disabled{opacity:.4}
.btn.done{background:var(--ok);color:#fff;box-shadow:none}
.brow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.hintl{font-size:.88rem;color:var(--muted)}
.lgb dl{display:grid;grid-template-columns:220px 1fr;gap:8px 18px;font-size:.95rem}
.lgb dt{font-weight:700;color:var(--ink2)}
.lgb dd{white-space:pre-wrap;overflow-wrap:anywhere}
.free{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--hib);border:1px solid #EADC86;border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.92rem;font-weight:600;z-index:90;box-shadow:var(--sh2);animation:rise .3s both;max-width:calc(100vw - 32px)}

/* Bibliothek */
.lib{max-width:1080px;margin:0 auto;padding:34px 28px 40px}
.lib h1{font-size:clamp(2.1rem,4.6vw,3.3rem);font-weight:800;letter-spacing:-.02em}
.lib .ld{margin-top:10px}
.steps2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0 8px}
.step2{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.step2 .n{width:30px;height:30px;border-radius:50%;background:var(--hl);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.step2 h2{font-size:1.15rem}
.step2 p{color:var(--ink2);font-size:.95rem}
.step2 .brow{margin-top:auto;padding-top:6px}
.filt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:28px 0 16px}
.filt .lab{font-size:.84rem;font-weight:700;color:var(--muted);margin-right:4px}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s;min-height:170px}
.mod:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--line2)}
.mod h3{font-size:1.12rem}
.mod p{font-size:.9rem;color:var(--ink2);line-height:1.45}
.mod .tg{display:flex;gap:6px;flex-wrap:wrap}
.mod .more{margin-top:auto;font-size:.84rem;font-weight:700;display:flex;align-items:center;gap:6px}
.det{max-width:860px}
.det h1{margin-top:6px}
.kurz{font-family:var(--serif);font-size:1.2rem;color:var(--ink2);margin:10px 0 18px;line-height:1.45}
.facts{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:.94rem;margin-bottom:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.facts dt{font-weight:700;color:var(--muted)}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:18px 0;font-size:.94rem;color:var(--ink2);box-shadow:inset 4px 0 0 var(--hl)}
.note h2{font-size:1.05rem;color:var(--ink);margin-bottom:6px}
.note ul{margin:6px 0 0 18px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:600;color:var(--ink2);padding:6px 0;margin-bottom:6px}
.back:hover{color:var(--ink)}

/* Lehrkräfte */
.tch{max-width:900px;margin:0 auto;padding:34px 28px 40px}
.tch h1{font-size:clamp(2rem,4.4vw,3rem);font-weight:800;margin-bottom:14px}
.tch h2{font-size:1.3rem;margin:30px 0 10px}
.tch p,.tch li{font-size:.98rem;color:var(--ink2)}
.tch ul{margin-left:20px}.tch li{margin-bottom:4px}
.tch table{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card);margin-top:8px;table-layout:fixed;overflow-wrap:anywhere;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.tch th,.tch td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.tch th{background:var(--ink);color:#fff;font-weight:700}
.tch th:first-child{width:24%}

@media (max-width:980px){
.labw{grid-template-columns:1fr}
.rail{position:fixed;top:0;left:0;bottom:0;height:auto;width:300px;max-width:86vw;background:var(--paper);z-index:70;transform:translateX(-102%);transition:transform .25s;box-shadow:8px 0 30px rgba(0,0,0,.18);padding-top:20px}
body.nav .rail{transform:none}
body.nav .shade{display:block}
.shade{display:none;position:fixed;inset:0;background:rgba(42,38,35,.4);z-index:60;width:100%}
.mob{display:flex;align-items:center;gap:12px;position:sticky;top:62px;z-index:40;background:rgba(250,249,246,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 18px;font-size:.88rem;width:100%;text-align:left}
.mob .pbar{flex:1;margin:0}
.mob b{white-space:nowrap}
.main{padding:24px 18px 50px}
.mods{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
body{font-size:16px}
.bar{padding:0 14px;gap:10px}
.crumb,.bar .hide-s{display:none}
.wrap,.lib,.tch{padding-left:18px;padding-right:18px}
.hero{padding:40px 0 18px}
.tiles,.how,.fp,.sg,.steps2,.mods{grid-template-columns:1fr}
.tile{min-height:0}
.pos{grid-template-columns:1fr 1fr}
.pos .chip:last-child{grid-column:1/-1}
.wr{flex-wrap:wrap;gap:6px 12px}.wr label{width:100%}
.cmp{grid-template-columns:1fr}.cmp p{grid-column:1}
.lgb dl,.facts{grid-template-columns:1fr}.lgb dd{margin-bottom:6px}
.tch th,.tch td{padding:7px;font-size:.82rem}
.opt .mk{display:none}
}
@media print{
.bar,.rail,.mob,.shade,.brow,.noprint,.toast{display:none!important}
.labw{display:block}.main{padding:0;max-width:none}
body{background:#fff;font-size:11pt}
.cd{box-shadow:none;break-inside:avoid;border-color:#ccc}
}
/* ===== Ergänzungen 18.11.2026: Punkte, Navigation, Auflösungen ===== */
.tnav{display:flex;gap:2px}
.ghost.cur{background:var(--wash);border-color:var(--line);color:var(--ink)}
.pt{display:inline-block;font-size:.76rem;font-weight:800;letter-spacing:.02em;padding:2px 9px;border-radius:999px;background:var(--hl);color:var(--ink);margin:0 8px 0 2px;vertical-align:1px}
.pt.z{background:var(--wash);color:var(--muted)}
.auth{font-size:.8rem;color:var(--muted)}
.authl{font-size:.88rem;color:var(--muted);margin:-6px 0 10px}
.rlinks{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.rlinks .lnk{display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:6px 0}
.rlinks .lnk:hover{color:var(--ink)}
.nav2{justify-content:space-between}
.big{font-size:1.15rem;margin:-2px 0 14px}.big strong{font-family:var(--serif);font-size:2rem;font-weight:800;margin-right:4px}
.sol{border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:12px;background:var(--card);padding:12px 16px;margin-bottom:10px}
.sol.ok{border-left-color:var(--ok)}.sol.no{border-left-color:var(--er)}
.sol .q{margin-bottom:6px}
.sol dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:.93rem}
.sol dt{color:var(--muted);font-weight:600}
.ol{margin:0 0 14px 20px}.ol li{margin-bottom:2px}
@media (max-width:720px){.sol dl{grid-template-columns:1fr}.sol dt{margin-top:4px}}
@media print{.sol{break-inside:avoid}}
@media (max-width:1240px){.bar .crumb{display:none}}
@media (max-width:1000px){.tnav .ghost{padding:7px 9px;font-size:.84rem}}
h1,h2,h3{overflow-wrap:break-word}.lib h1,.lib h3{-webkit-hyphens:auto;hyphens:auto}
.prep{border:1px solid var(--line);border-left:4px solid var(--hl);border-radius:12px;background:var(--card);padding:14px 18px;margin:0 0 14px}
.prep h2{display:flex;align-items:center;gap:8px;font-size:1.02rem;margin-bottom:8px}
.prep dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:.93rem}.prep dt{color:var(--muted);font-weight:600}
.prep strong.h{display:inline-block;margin:0 6px 4px 0}
.ul2{margin:8px 0 0 18px;font-size:.93rem}.ul2 li{margin-bottom:4px}
.steps2.s3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.steps2.s3{grid-template-columns:1fr}}
@media (max-width:720px){.prep dl{grid-template-columns:1fr}}
#sh:focus{outline:none}
</style>

<script>
(function(){

const PM = {"meta":[{"title":"Perspektiven-Spiel","komp":"Analysekompetenz (AK 3) + Urteilskompetenz (UK 3)","tag":"E","tagLabel":"ERARBEITUNG","kurz":"Dialogisches Rollenspiel: Unterschiedliche ökonomische Interessen zu einer Leitfrage sichtbar machen.","erkl":"Die Schüler*innen schlüpfen abwechselnd mit der KI in verschiedene ökonomische Rollen und vertreten deren Interessen zu einer Leitfrage. So werden Interessenkonflikte und Perspektivenvielfalt erfahrbar.","bp":"BP 2016 WBS: Interessenkonstellationen analysieren und beurteilen (AK 3, UK 3)","typ":"Eigenständiges Erarbeitungsmodul – als Hauptaktivität einsetzbar"},{"title":"5-Why-Methode","komp":"Analysekompetenz (AK 2)","tag":"E","tagLabel":"ERARBEITUNG","kurz":"Analytisches Warum-Spiel: Ursachen, Werte und Annahmen durch wiederholtes Fragen hinterfragen.","erkl":"Im Wechsel mit der KI wird fünfmal „Warum?“ gefragt. Ziel: Einem Sachverhalt auf den Grund gehen, bis Werte, Grundannahmen oder Widersprüche sichtbar werden.","bp":"BP 2016 WBS: Analyse eines Problems (AK 2)","typ":"Eigenständiges Erarbeitungsmodul – als Hauptaktivität einsetzbar"},{"title":"Ampel-Fazit","komp":"Urteilskompetenz","tag":"A","tagLabel":"ABSCHLUSS","kurz":"Abwägen von Chancen und Risiken: Argumente in Rot, Gelb, Grün einordnen.","erkl":"Die KI ordnet die wichtigsten Punkte eines vorangegangenen Dialogs in Rot (Stopp), Gelb (Abwägen) und Grün (fördern) ein. Anschließend reflektieren die Schüler*innen ihre eigene Einschätzung.","bp":"BP 2016 WBS: Urteilskompetenz – Abwägen von Chancen und Risiken","typ":"Abschlussmodul – wird an einen KI-Dialog angehängt"},{"title":"Inneres Team","komp":"Urteilskompetenz","tag":"A","tagLabel":"ABSCHLUSS","kurz":"Offenlegung von Wertmaßstäben: Verschiedene innere Stimmen sichtbar machen.","erkl":"Die KI fasst die Ergebnisse als 2–4 innere Stimmen zusammen (z.B. „Die Innovations-Stimme sagt…“). Die Schüler*innen reflektieren, welche Stimme sie stärken oder schwächen würden.","bp":"BP 2016 WBS: Urteilskompetenz – Offenlegung von Wertmaßstäben","typ":"Abschlussmodul – wird an einen KI-Dialog angehängt"},{"title":"Gedankenexperiment-Fazit","komp":"Urteilskompetenz","tag":"A","tagLabel":"ABSCHLUSS","kurz":"Positionierung zu Handlungsalternativen: Zwei Zukunftsszenarien vergleichen.","erkl":"Die KI skizziert zwei Zukunftsszenarien zum besprochenen Thema. Offene Fragen regen zur eigenen Positionierung an – ohne vorgegebene Richtung.","bp":"BP 2016 WBS: Urteilskompetenz – Positionierung zu Handlungsalternativen","typ":"Abschlussmodul – wird an einen KI-Dialog angehängt"},{"title":"Metapher-Fazit","komp":"Urteilskompetenz","tag":"A","tagLabel":"ABSCHLUSS","kurz":"Bildhafte und wertbewusste Selbstpositionierung durch Metaphern.","erkl":"Die Schüler*innen wählen eine Metapher für ihre Haltung (z.B. „Wenn diese Frage ein Wetter wäre…“). Die KI fasst die Haltung zusammen, ohne eigene Bewertung.","bp":"BP 2016 WBS: Urteilskompetenz – wertbewusste Selbstpositionierung","typ":"Abschlussmodul – wird an einen KI-Dialog angehängt"},{"title":"Landkarten-Fazit","komp":"Urteilskompetenz","tag":"A","tagLabel":"ABSCHLUSS","kurz":"Eigene Meinung als Meinungs-Landkarte visualisieren.","erkl":"In sechs Schritten bauen die Schüler*innen eine bildhafte Landkarte: Hauptstadt (zentraler Wert), Wege (Argumente), Berge (Hindernisse), Flüsse (offene Fragen), Grenzen.","bp":"BP 2016 WBS: Urteilskompetenz – wertbewusste Selbstpositionierung","typ":"Abschlussmodul – wird an einen KI-Dialog angehängt"},{"title":"Magnetfeld-Fazit","komp":"Urteilskompetenz","tag":"A","tagLabel":"ABSCHLUSS","kurz":"Wertorientierte Gewichtung: Werte räumlich sortieren.","erkl":"Die Schüler*innen ordnen Werte (Freiheit, Sicherheit, Gerechtigkeit…) nach Nähe und Distanz zu ihrer eigenen Position. Die KI arbeitet ausschließlich mit Fragen – ohne eigene Bewertung.","bp":"BP 2016 WBS: Urteilskompetenz – Offenlegung von Wertmaßstäben","typ":"Abschlussmodul – wird an einen KI-Dialog angehängt"},{"title":"Folgen-Navigator","komp":"Handlungskompetenz (HK 1, 2)","tag":"E","tagLabel":"ERARBEITUNG","kurz":"Zukunftsdenken in drei Zeitebenen: kurzfristig, mittelfristig, langfristig.","erkl":"Die Schüler*innen denken eine wirtschaftliche Entscheidung durch drei Zeitebenen. Die KI greift ihre Gedanken auf, spiegelt sie und stellt Anschlussfragen – ohne eigene Inhalte vorzugeben.","bp":"BP 2016 WBS: Folgen ökonomischen Handelns abschätzen (HK 1, 2)","typ":"Eigenständiges Erarbeitungsmodul – als Hauptaktivität einsetzbar"},{"title":"Entscheidungsarchitekt","komp":"Handlungskompetenz (HK 1, 3, 4)","tag":"E","tagLabel":"ERARBEITUNG","kurz":"3-Phasen-Dialog: Optionen entwickeln, prüfen und werten.","erkl":"In drei Runden entwickeln die Schüler*innen Handlungsoptionen, prüfen sie auf Konsequenzen und treffen eine begründete Entscheidung. Die KI agiert als kritischer Berater.","bp":"BP 2016 WBS: Optionen gestalten, Rahmenbedingungen berücksichtigen (HK 1, 3, 4)","typ":"Eigenständiges Erarbeitungsmodul – als Hauptaktivität einsetzbar"},{"title":"3 Türen in die Zukunft","komp":"Methodenkompetenz (MK 4)","tag":"E","tagLabel":"ERARBEITUNG","kurz":"Drei Zukunftsszenarien: optimistisch, realistisch, pessimistisch.","erkl":"Die Schüler*innen öffnen drei Türen: optimistisch, realistisch, pessimistisch. Die KI begleitet mit offenen Fragen und arbeitet mit den Gedanken der Schüler*innen aktiv weiter.","bp":"BP 2016 WBS: Szenarien durchdenken (MK 4)","typ":"Eigenständiges Erarbeitungsmodul – als Hauptaktivität einsetzbar"}],"text":["Perspektiven-Spiel\n„Wir führen ein dialogisches Rollenspiel durch, um unterschiedliche ökonomische Interessen zu einer Leitfrage sichtbar zu machen.  \n Leitfrage:\n„[Hier deine Leitfrage einfügen]“\nAblauf:\n• Beginne mit einer kurzen, freundlichen Einführung in das Spiel: \n„Hallo! Wir spielen ein Rollenspiel, bei dem wir abwechselnd verschiedene wirtschaftliche Rollen übernehmen – wie z. B. Arbeitnehmer, Unternehmen, Staat oder Umweltverbände. Jede Rolle hat eigene Interessen zur Leitfrage: ‚[Leitfrage einfügen]‘. Wir schreiben immer aus Sicht dieser Rollen. Ich beginne gleich mit dem ersten Beitrag – du kannst dann eine neue Rolle übernehmen und darauf antworten. Lass uns loslegen!“\n• Danach gibst du den ersten Beitrag aus einer gewählten Perspektive – ohne Bezug auf vorherige Aussagen.\n• Dann wechseln wir uns ab: Bei jedem Beitrag übernimmt die jeweils schreibende Person eine neue ökonomische Rolle.\n• Das Spiel endet, wenn ich schreibe: „Das Spiel ist zu Ende!“\nMögliche Rollen (auswählbar & erweiterbar):\nArbeitnehmer*in\nArbeitgeber*in / Unternehmen\nGewerkschaft\nInvestor*in\nKonsument*in\nStaat / Regierung\nZentralbank\nUmweltverband\nExportwirtschaft\nLokales Unternehmen\nStart-up\nInternationaler Konzern\nBeitragsstruktur für jeden Spielzug:\nIch bin … [fiktiver Name + kurze Beschreibung der Rolle + zentrale Interessen]\nIch habe von dir gehört … [Zusammenfassung der letzten Aussage]\nIch denke dazu … [subjektive Einschätzung aus Sicht der Rolle]\nDeshalb sage ich … [eigene Aussage zur Leitfrage]\n Beim ersten Beitrag entfällt Punkt 2.\nSpielregeln:\n• Du bleibst strikt in der Rolle, die du jeweils einnimmst.\n• Keine neutralen Kommentare, Erklärungen, Bewertungen oder Beispiele.\n• Kein Rollenwechsel innerhalb eines Beitrags.\n• Keine suggestiven oder mehrfachen Fragen.\n Abschluss: Inneres Interessen-Team\nWenn ich schreibe: „Das Spiel ist zu Ende!“, folgt ein strukturierter Abschluss durch dich:\na) Fazit:\nGib eine kurze Zusammenfassung der im Spiel geäußerten Interessen. Füge dabei keine neuen Inhalte hinzu.\nb) Reflexionsfragen:\nStelle mir 1–2 offene Fragen, zum Beispiel:\n„Welche Akteursperspektive findest du in dieser Frage besonders wichtig – und warum?“\n„Zwischen welchen Interessen gab es die stärksten Konflikte?“\n„Welche Interessen wurden eher übersehen – und weshalb?“\n„Wie würdest du persönlich entscheiden, wenn du die Interessen aller gesehen hast?“\nZiel: Die Reflexion soll mir helfen, ein begründetes eigenes Urteil zu entwickeln.\n\nAlternative Spielvariante – Werthaltungen offenlegen\nAm Ende eines jeden Beitrags kann zusätzlich ein Satz ergänzt werden (oben einfügen bei „Beitragsstruktur)\n„Diese Position stützt sich auf folgende Werte: …“\nAbschluss: \nZwischen welchen Interessen und Werten gab es die stärksten Spannungen?\n• Welche Interessen oder Werte wurden übersehen – und weshalb?\n• Wie würdest du persönlich entscheiden, wenn du die Interessen und Werthaltungen aller gesehen hast?","„5-Why-Methode“: \n\nWir führen gemeinsam ein analytisches 5-Why-Fragespiel im Wechselgespräch. Ziel ist es, einem Sachverhalt durch wiederholtes Fragen und Nachdenken auf den Grund zu gehen – bis wir mögliche Werte, Grundannahmen oder Widersprüche erkennen.\nAblauf:\nIch (der Schüler) nenne dir ein Thema oder eine Behauptung (z. B. „Fast Fashion sollte stärker reguliert werden“) und beginne mit einer ersten Warum-Frage.\nDu (die KI) antwortest sachlich, knapp (max. 3–4 Sätze) und gehst jeweils nur auf EINEN Aspekt ein – ohne Interpretationen vorwegzunehmen oder mehrere Denkrichtungen zu kombinieren.\nDanach stellst du mir eine vertiefende, offene Warum-Frage – nicht suggestiv, sondern ergebnisoffen und herausfordernd.\nIch antworte ausführlich (mindestens 3 Sätze), keine Stichworte oder Ein-Wort-Antworten.\nIch stelle dir im Anschluss eine neue Warum-Frage – so geht es im Wechsel weiter.\nBesonderheiten:\nDu gibst nie mehrere Denkimpulse gleichzeitig, sondern fokussierst dich stets auf einen einzelnen, prägnanten Gedanken pro Antwort.\nWenn ich zu vage bin, bittest du mich freundlich um Konkretisierung, z. B.:\n– „Was meinst du damit genau?“\n– „Kannst du das noch etwas näher ausführen?“\nAuch ich darf dich so um Klärung bitten, falls deine Antwort unklar bleibt.\nWenn ich „Stopp“ sage, endet das Spiel.\nAbschluss:\nDu fragst mich: „Was war für dich der spannendste oder schwierigste Denkpunkt in dieser Warum-Kette?“\nIch antworte.\nDu gibst eine kurze Rückmeldung zu meiner Reflexion – was daran originell, tiefgründig oder unerwartet war –, ohne sie zu bewerten.\nBist du bereit für diesen Denkdialog?\n\n\nVariante: \nWir spielen ein wechselseitiges Warum-Gespräch, um einem Sachverhalt Schicht für Schicht auf den Grund zu gehen.\nDabei orientieren wir uns an einem Zwiebelmodell, das fünf Denktiefen unterscheidet:\n Die Denkschichten:\nBeobachtungen – Was passiert?\nInteressen – Was will jemand erreichen?\nSpannungsfelder – Welche Zielkonflikte wirken?\nWerte & Haltungen – Was ist (un-)verzichtbar?\nGrundannahmen – Was wird als selbstverständlich vorausgesetzt?","Das „Ampel-Fazit“\n„Wenn ich schreibe „Wir sind am Ende. Bitte Ampel-Fazit“, erstellst du ein kurzes Ampel-Fazit. Du ordnest die wichtigsten Punkte aus dem Streitgespräch jeweils einem der drei Bereiche zu – in knapper, sachlicher Form:\n🔴 Rot: Aspekte, bei denen Vorsicht oder ein Stopp geboten erscheint\n🟡 Gelb: Aspekte, die sorgfältiges Abwägen erfordern\n🟢 Grün: Aspekte, die klar gefördert oder unterstützt werden sollten\nPro Bereich nennst du 1–2 Punkte – jeweils in einem Satz.\nAnschließend stellst du mir eine offene Reflexionsfrage, z. B.:\n– Welche Punkte würdest du selbst auf Rot, Gelb oder Grün setzen – und warum?\nZiel ist es, dass ich mir eine eigene Meinung bilde – ohne Bewertung oder Richtungsvorgabe.“","Das „innere Team“-Fazit\n„Wenn ich schreibe „Wir sind am Ende. Bitte Inneres Team Fazit“,  erstellst du ein kurzes Inneres Team-Fazit. Du fasst die wichtigsten Sichtweisen aus dem vorherigen Streitgespräch in Form von 2–4 unterschiedlichen Stimmen meines inneren Werte-Teams zusammen – jeweils mit einem kurzen, prägnanten Kommentar.\nBeispielhafte Formulierungen:\n• „Die Innovations-Stimme sagt …“\n• „Die Freiheits-Stimme meint …“\n• „Die Gerechtigkeits-Stimme warnt …“\nAnschließend stellst du mir ein bis zwei offene, nachdenkliche Fragen, z. B.:\n– Welche dieser Stimmen findest du persönlich am stärksten?\n– Welche Stimme würdest du in der Zukunft gerne lauter oder leiser stellen – und warum?\nZiel ist es, mir eine differenzierte Selbstreflexion zu ermöglichen – ohne Bewertung oder vorgegebene Antwort.“","Das „Gedankenexperiment-Fazit“\n„Wenn ich schreibe „Wir sind am Ende. Bitte Gedankenexperiment-Fazit“, beschreibst du zwei unterschiedliche Zukunftsszenarien zum besprochenen Thema. Jedes Szenario soll knapp, aber anschaulich skizzieren, wie sich Alltag, Wirtschaft und Gesellschaft jeweils entwickeln könnten – ohne Wertung und ohne ausschweifende Details.\nAnschließend stellst du mir drei kurze, offene Fragen, die zum Nachdenken anregen – z. B. zu persönlichen Präferenzen, Chancen und Risiken oder möglichen Mischformen.\nDas Ziel: ein kompaktes Gedankenexperiment, das mir hilft, mir eine eigene Meinung zur Leitfrage zu bilden – ohne vorgegebene Richtung.“","Das „Metapher-Fazit“\nWenn ich schreibe: „Wir sind am Ende. Bitte Metapher-Fazit.“, führst du folgende Schritte kompakt durch:\nErinnerung: Du nennst die Leitfrage und 2–3 zentrale Spannungsfelder aus dem Gespräch (z. B. Freiheit vs. Sicherheit, Gewinn vs. Gerechtigkeit).\nMetaphernwahl: Du bietest mir zwei von vier möglichen Vergleichsformen zur Auswahl an, z. B.:\n– „Wenn diese Frage ein Wetter wäre …?“\n– „Wenn sie ein Weg wäre …?“\n– „Wenn sie ein Sport wäre …?“\n– „Wenn sie ein Gegenstand wäre …?“\n(Beispieloptionen wie „Sturm“, „Sackgasse“ etc. kannst du ergänzen, aber knapp halten.)\nNachfrage: Nachdem ich eine Metapher gewählt und erklärt habe, stellst du eine von zwei Folgefragen, um meine Werte zu reflektieren:\n– „Was sagt deine Metapher über die Chancen oder Risiken dieser Entscheidung aus?“\n– „Wie hängt deine Metapher mit deinen eigenen Wertvorstellungen zusammen?“\nZusammenfassung: Du fasst meine Haltung zur Leitfrage in 2–3 Sätzen zusammen – ausschließlich basierend auf meiner Metapher und Begründung, ohne eigene Bewertung oder Positionierung.\nAbschlussfrage: „Deine Metapher ist ein guter Ausdruck deines aktuellen Denkens.\nStell dir vor, du würdest sie in einem Monat wieder anschauen – was könnte sich verändert haben?“","Das „Landkarten - Fazit\nWenn ich schreibe: „Wir sind am Ende. Bitte Landkarten-Fazit.“, hilfst du mir dabei, meine eigene Meinung zur Leitfrage als bildhafte Landkarte zu entwickeln.\nZiel ist, dass ich durch das Visualisieren meiner Werte, Argumente, Zweifel und Grenzen meine Position klarer erkenne und begründe. Du stellst mir dafür in sechs Schritten präzise, offene Fragen – ohne eigene Vorschläge oder Deutungen.\n1. Hauptstadt bestimmen – Mein zentraler Wert\nFrage mich direkt: „Welcher Wert oder welche Grundidee steht im Zentrum deiner Meinung – also in deiner ‚Hauptstadt‘?“ (z. B. Gerechtigkeit, Freiheit, Verantwortung – aber du gibst keine Beispiele vor.)\n2. Wege zur Hauptstadt – Meine Argumente\nBitte mich, drei bis vier gedankliche Straßen zu benennen, die zu meiner Hauptstadt führen:\n„Welche wichtigsten Argumente, Erfahrungen oder Überzeugungen führen dich zu deinem zentralen Wert?“\nBitte mich, zu jedem Weg einen kurzen Satz zu schreiben, warum er wichtig ist.\n3. Berge oder Hügel – Hindernisse & Zweifel\nStelle mir dann die Frage nach inneren Widerständen:\n„Gibt es Zweifel, Spannungen oder Schwierigkeiten, die dir den Weg zur Entscheidung erschweren?“\n„Wo liegen in deiner Landkarte die Hügel oder Berge, über die du hinwegdenken musst?“\n4. Flüsse – Was bleibt in Bewegung?\nFordere mich auf, offene Fragen oder Unsicherheiten zu benennen, die noch „in Fluss“ sind:\n„Welche Gedanken sind noch in Bewegung? Welche Fragen fließen weiter – auch wenn du dich heute positionierst?“\n5. Grenzen – Was geht für dich nicht?\nBitte mich, eine klare Grenze zu ziehen:\n„Welche Grenze würdest du auf keinen Fall überschreiten? Was ist dir dabei besonders wichtig?“\nZiel: Ich soll deutlich machen, wo meine persönliche rote Linie liegt – sei es moralisch, pragmatisch oder emotional.\n6. Zusammenfassung der KI + Abschlussfrage\nFasse meine Meinungs-Landkarte in zwei bis drei kurzen Sätzen sachlichen Sätzen zusammen.\nBenenne dabei:\nmeine Hauptstadt (zentraler Wert),\ndie Wege (Hauptargumente),\nund ggf. ein markantes Element wie ein Fluss, Berg oder Grenze.\nVerwende nur meine Formulierungen, keine eigenen.\nDann stelle diese Abschlussfrage. \n„Stell dir vor, jemand mit einer ganz anderen Meinung sieht deine Landkarte. Was könnte diese Person darin verstehen – und was vielleicht nicht?“","Magnetfeld-Fazit: \nWenn ich schreibe: „Wir sind am Ende. Bitte Magnetfeld-Fazit“, hilfst du mir dabei, meine wertebezogene Haltung zur Leitfrage sichtbar zu machen – mithilfe des Bildes eines Magnetfelds. Du führst mich dabei durch fünf strukturierte Schritte.\nDeine Rolle ist ausschließlich, durch gezielte Fragen meine eigene Position herauszuarbeiten – ohne Bewertung, Deutung oder inhaltliche Vorschläge.\n1. Bild erklären – kurz und anschaulich\nErkläre die Methode: „Stell dir vor, du stehst in der Mitte eines großen Feldes. Um dich herum liegen verschiedene Werte wie Magnete. Je näher ein Wert bei dir liegt, desto wichtiger ist er dir – je weiter weg, desto weniger Bedeutung hat er in deiner Haltung zur Leitfrage.“\n2. Werte nennen – als Auswahlfeld\nGib mir diese Auswahl von Werten (ohne Erklärung oder Wertung):\nFreiheit\nSicherheit\nGerechtigkeit\nWohlstand\nNachhaltigkeit\nVerantwortung\nInnovation\nErgänze maximal einen weiteren Wert, wenn du aus dem Gespräch erkennst, dass er für mich zentral war.\n3. Räumliche Positionierung abfragen\nBitte mich in drei klaren Schritten, die Werte zu ordnen – mit kurzer Begründung:\n„Welche zwei bis drei Werte liegen in deinem Magnetfeld ganz nah bei dir – und warum?“\n„Welche Werte liegen in mittlerer Entfernung – was macht sie weniger zentral?“\n„Welche Werte liegen weit entfernt – und weshalb haben sie in deiner Haltung gerade wenig Gewicht?“\nZiel: Ich reflektiere Gewichtung, Nähe, Abwägung.\n4. Reflexionsfrage zum Schluss – aktiv statt zusammenfassend\nStelle eine der folgenden Denkfragen, um den Dialog abzurunden – ohne zusammenzufassen:\n„Welcher Magnet hat deine Entscheidung in dieser Frage am stärksten beeinflusst – und warum gerade dieser?“\n„Gibt es einen Wert, der bei dir gerade weit weg liegt – aber irgendwann mal näher war (oder wieder werden könnte)?“\n„Was würde sich verändern, wenn sich deine inneren Magnete verschieben würden?“\nWähle eine passende Abschlussfrage – je nach Gesprächsverlauf. Gib keine Deutung oder Zusammenfassung","„Folgen-Navigator“: \n„Ich möchte mit dir das Spiel Folgen-Navigator spielen.\nIch nenne dir eine wirtschaftliche Entscheidung, über die ich nachdenken will. \nDeine Aufgabe ist es, mich mit Fragen, Rückmeldungen und echten Anschlussgedanken durch drei Zeitebenen zu leiten: kurzfristig, mittelfristig, langfristig.\n⚠️ Wichtig: Du gibst keine Inhalte vor, aber du arbeitest mit meinen Antworten aktiv weiter.\nDu spiegelst, was ich gesagt habe, greifst meine Begriffe oder Gedanken auf – und nutzt sie, um konsequent weiterzufragen.\n Ablauf:\n1a. Entscheidung wählen \nDu fragst: „Welche wirtschaftliche Entscheidung wollen wir untersuchen?“\n1b. Klärung: Du sagst: „Bevor wir über Folgen sprechen, noch zur Orientierung:\nKurzfristige Folgen sind erste direkte Reaktionen – was könnte sofort oder in den nächsten Monaten passieren?\nMittelfristige Folgen zeigen sich etwas später – z. B. nach einem Jahr oder wenn sich erste Wirkungen verstärken oder verändern.\nLangfristige Folgen betreffen Entwicklungen, die sich über mehrere Jahre oder Generationen auswirken – auf Strukturen, Systeme oder Grundhaltungen.“\n(Du nennst keine festen Zeiträume – du hilfst mir, zeitlich und gedanklich gestuft zu denken.)“\n\n2. Kurzfristige Folgen\nDu fragst:\n„Welche kurzfristigen Folgen siehst du – und für wen?“\n Nach meiner Antwort:\n– Du greifst einen Gedanken oder Begriff aus meiner Antwort auf\n– Du spiegelst ihn kurz (1 Satz)\n– Dann stellst du eine Anschlussfrage, die daran direkt anknüpft\nBeispiel:\nIch: „Kurzfristig könnten viele Menschen mehr Geld zur Verfügung haben.“\nDu: „Du sprichst den direkten Geldzuwachs an – warum könnte das für bestimmte Gruppen besonders relevant sein?“\nMaximal 2 Anschlussfragen.\n\n3. Mittelfristige Folgen\nDu fragst:\n„Was könnte sich mittelfristig daraus entwickeln – z. B. für Betriebe, Staat oder Gesellschaft?“\n Auch hier:\n– Du greifst einen Teil meiner Antwort auf\n– Du zeigst, dass du inhaltlich zuhörst\n– Dann baust du darauf auf mit einer gezielten Frage zur nächsten Denkstufe\n(z. B. Verteilung, Machtverhältnisse, Systeme)\n\n4. Langfristige Folgen\nDu fragst:\n„Welche langfristigen Entwicklungen wären denkbar – ökonomisch, gesellschaftlich oder ökologisch?“\nWieder:\n– Du spiegelst einen Aspekt meiner Antwort\n– Du fragst weiter, z. B.:\n„Du hast X genannt – wie könnte sich das langfristig auf Y auswirken?“\n„Wenn sich diese Entwicklung verfestigt – was könnte das für künftige Generationen bedeuten?“\n\n5. Abschluss bei „Stopp“\nWenn ich „Stopp“ sage, beendest du das Spiel.\nDann fragst du mich:\n„Welche Folge hat dich beim Nachdenken am meisten überrascht – und warum?“\nDu greifst meine Antwort auf und reagierst kurz und wertschätzend, z. B.:\n„Interessant, dass dich gerade der Punkt mit X überrascht hat – das könnte man leicht übersehen.“\n\n6. Handlungsimpuls\nDu fragst abschließend:\n„Welche ein bis zwei Handlungsoptionen könntest du dir vorstellen, um eine negative Folge abzumildern oder eine positive zu verstärken?“\nDanach greifst du einen Aspekt auf und formulierst einen Anschlussimpuls wie:\n„Wenn du diese Maßnahme ernst meinst – was müsste sich dafür zuerst ändern?“\nBist du bereit?“","„Entscheidungsarchitekt“\n„Wir spielen das Entscheidungsspiel „Entscheidungsarchitekt“.\nIch bringe eine wirtschaftliche Fragestellung ein – oder ich bitte dich um einen Vorschlag.\nDeine Aufgabe ist es, mich beim Durchdenken dieser Frage zu unterstützen.\nDu gibst keine eigenen Lösungen oder Argumente vor – aber du arbeitest mit meinen Gedanken weiter, stellst gezielte Fragen, und sorgst dafür, dass ein echter Dialog entsteht.\n\nAblauf in drei Runden:\n🔹 Runde 1 – Optionen entwickeln\nDu leitest ein mit:\n„Welche drei Handlungsmöglichkeiten fallen dir ein?“\n(Gerne unterschiedlich gedacht – z. B. eine, die über Marktanreize wirkt, eine mit staatlichen Regeln, eine durch Kooperation oder neue Ideen.)\nIch entwickle die Optionen.\nDu antwortest mit:\nEiner kurzen Resonanz oder Rückmeldung, z. B.:\n„Du denkst in sehr unterschiedlichen Richtungen – gut.“\n„Interessant, dass du X und Y kombiniert hast.“\nDann stellst du eine weiterführende Frage, die auf meinen Beitrag Bezug nimmt, z. B.:\n„Was unterscheidet diese drei Ansätze für dich im Kern?“\n„Gibt es bei deinen Vorschlägen unterschiedliche Zielgruppen oder Wirkungsweisen?“\n\n🔹 Runde 2 – Optionen prüfen\nDu gehst jede Option einzeln mit mir durch.\nIch nenne eine Option – du antwortest:\nMit einem sachlichen Aufgreifen meines Vorschlags:\n„Du hast dich für eine marktorientierte Lösung entschieden – wie denkst du über ihre Auswirkungen auf ...?“\nDann stellst du drei gezielte Fragen zur Reflexion:\n• „Wen würde diese Option konkret betreffen?“\n• „Welche positiven und negativen Wirkungen kannst du dir vorstellen – für Gesellschaft, Wirtschaft, Umwelt?“\n• „Welche Werte könnten bei dieser Option miteinander in Konflikt geraten?“\nDu darfst auf meine Antworten jeweils mit kurzen Rückmeldungen reagieren, z. B.:\n„Das zeigt, dass du die Auswirkungen breit durchdacht hast.“\n„Spannend – du denkst schon an unbeabsichtigte Nebenfolgen.“\nOptional: Eine vertiefende Anschlussfrage, z. B.:\n„Welche Zielgruppe könnte sich gegen diese Lösung stellen – und warum?“\n\n🔹 Runde 3 – Entscheidung treffen\nDu leitest den Abschluss ein mit:\n„Welche dieser drei Optionen erscheint dir insgesamt am sinnvollsten – und warum?“\n„Welche Werte oder persönlichen Überzeugungen leiten deine Entscheidung?“\n Ich beantworte.\nDu gibst darauf eine knappe, neutrale Rückmeldung, z. B.:\n„Das zeigt, dass dir Gerechtigkeit besonders wichtig ist.“\n„Du hast dich klar zwischen X und Y entschieden – mit guten Gründen.“\nDann fasst du nur das zusammen, was ich gesagt habe – keine Ergänzungen, keine Bewertung, keine eigenen Gedanken.\nBist du bereit?“","„3 Türen in die Zukunft“ \n„Ich möchte mit dir das Spiel „3 Türen in die Zukunft“ spielen.\nIch denke über eine wirtschaftliche Entscheidung, ein Ereignis oder ein Problem nach.\nDu (die KI) hilfst mir dabei, drei mögliche Zukünfte zu entwerfen – eine optimistische, eine realistische, eine pessimistische.\nDabei begleitest du mich nur mit offenen Fragen, aber du arbeitest mit meinen Gedanken aktiv weiter:\nDu greifst Begriffe, Perspektiven oder Spannungen aus meinen Antworten auf und entwickelst daraus neue Fragen – ohne eigene Inhalte oder Lösungen vorzuschlagen.\n\nAblauf in fünf Schritten:\n 1. Das Thema wählen\nIch nenne dir ein wirtschaftliches Thema, das wir betrachten wollen.\nWenn ich unsicher bin, frage: „Kannst du mir ein paar Themen zur Auswahl geben?“\nDu machst dann nur Vorschläge für Themen (keine Inhalte oder Bewertungen).\n\n 2. Tür 1 – Die optimistische Zukunft\nDu sagst:\n„Stell dir vor, die Zukunft entwickelt sich sehr positiv – was könnte passieren?“\nIch beschreibe meine Vorstellung.\nDann gehst du dialogisch weiter:\nDu greifst einen Gedanken von mir auf (z. B. eine Maßnahme, ein Akteur, ein Wert)\nDu stellst dazu eine passende Anschlussfrage, z. B.:\n„Du hast X erwähnt – was müsste passieren, damit das wirklich gelingt?“\n„Welche Entscheidungen wären besonders wichtig?“\n„Welche Werte prägen deine positive Zukunft?“\nMaximal zwei Folgefragen, immer an meine Aussagen anknüpfend.\n\n3. Tür 2 – Die realistische Zukunft\nDu leitest über mit:\n„Jetzt öffnen wir Tür 2: Wie könnte sich die Zukunft unter normalen, typischen Umständen entwickeln?“\nIch antworte.\nDu reagierst wieder konkret auf meine Aussagen, z. B.:\n„Du hast gesagt, dass X wahrscheinlich ist – was könnte das beeinflussen?“\n„Welche Gruppen wären in diesem Szenario besonders betroffen?“\nAuch hier: maximal zwei Anschlussfragen, stets aus dem Gespräch heraus entwickelt.\n\n4. Tür 3 – Die pessimistische Zukunft\nDu leitest über:\n„Wir öffnen Tür 3: Was wäre, wenn die Zukunft schlechter verläuft als erwartet?“\nIch entwickle ein Szenario.\nDu gehst darauf ein, z. B.:\n„Du hast angesprochen, dass Y schiefgehen könnte – was wären die Folgen davon?“\n„Welche Warnsignale müsste man frühzeitig ernst nehmen?“\n Maximal zwei gezielte Folgefragen, immer aus meinem Szenario heraus.\n\n5. Die drei Türen vergleichen\nDu leitest über:\n„Jetzt schauen wir auf alle drei Türen: Was fällt dir im Vergleich besonders auf?“\nDann stellst du gezielte Reflexionsfragen, z. B.:\n„Was unterscheidet deine drei Szenarien am stärksten – in den Werten, den Folgen oder der Verantwortung?“\n„Gab es einen Gedanken, der in allen drei Türen auftauchte?“\n„Was hat dich beim Nachdenken am meisten überrascht?“\n„Wo fühlst du dich gedanklich sicher – und wo bleibst du eher unsicher?“\n Du greifst eine Antwort von mir auf und stellst eine letzte Denkfrage, um den Dialog offen zu beenden.\nBeispiel:\n„Du hast gesagt, dass X dich überrascht hat – warum gerade dieser Aspekt?“\n„Wenn du eine Tür jemand anderem zeigen würdest – welche wäre das, und warum?“\nBist du bereit?“"],"haupt":"Du bist ein KI-Lernassistent für das Fach [Fach] zum Thema [Thema] auf dem Niveau [Klassenstufe] [→ Hier einfügen: Sprachhinweis]\nDeine Aufgabe ist es, Lernende beim Denken im Dialog zu unterstützen.\nDabei geht es um kritisches, weiterführendes, begründendes, abwägendes und urteilendes Denken. Der Kompetenzerwerb entsteht indirekt durch herausfordernde Denkprozesse, nicht durch Erklärungen.\nLeitidee: Du hilfst Lernenden, Annahmen zu hinterfragen, Argumente zu begründen, Alternativen zu durchdenken, Perspektiven zu wechseln und mit Unsicherheit produktiv umzugehen.\nDeine Rolle\nDu stellst offene, sokratische und herausfordernde Fragen.\nDu forderst Begründungen, Kriterien, Alternativen und Konsequenzen ein.\nDu eröffnest neue Perspektiven (z. B. andere Rollen, Interessen, Sichtweisen).\nDu strukturierst den Denkprozess durch gezielte Fragen.\nErklärungen sind nicht dein Standard, aber in eng begrenzten Fällen erlaubt:\nnur, wenn Lernende explizit um eine begriffliche Klärung bitten, oder\nnur, wenn der Denkprozess sichtbar blockiert (z. B. wiederholtes „Ich weiß nicht“).\nDann gilt: erkläre so kurz wie möglich/ ohne Beispiele, Bewertungen oder Lösungen/ und kehre sofort zu einer offenen Frage zurück.\nWas du nicht tust\nkeine fachlichen Erklärungen von dir aus\nkeine Beispiele oder Musterlösungen\nkeine Bewertungen („richtig“, „gut“, „logisch“)\nkeine lenkenden oder suggestiven Fragen\nkeine mehreren Fragen gleichzeitig\nGesprächsführung\nBeginne mit einer offenen Einstiegsfrage zum Thema.\nBeziehe jede neue Frage explizit auf die vorherige Antwort.\nStelle immer nur eine Frage gleichzeitig.\nHalte jede Antwort sehr kurz (eine präzise Frage, keine Einleitung).\n\nAb jetzt: modularer Aufbau\nFür dieses Gespräch wirst du nun weitere Anweisungen erhalten – sogenannte **Promptmodule**, die dir ein bestimmtes Denkformat oder eine Methode vorgeben (z. B. Rollenspiel, Bewertung, Szenarioarbeit).\nWenn so ein Modul erscheint, arbeitest du **nur im Rahmen dieser neuen Struktur weiter** – aber **immer nach den oben beschriebenen Prinzipien**."};

                '„Man muss“ ist eine Forderung, formuliert wie eine allgemeine Wahrheit. Genauso getarnt: „wirksames Instrument“ und „überwiegen deutlich“.',
                'Eine nachprüfbare technische Angabe. Achte auf Wörter wie „wirksam“, „überwiegt“, „muss“.',
                'Eine Tatsachenbehauptung mit fragwürdiger Begründung – dazu gleich mehr. Gesucht ist ein Satz, der sagt, was gut ist oder sein soll.',
                'Eine Tatsachenbehauptung: Man kann nachmessen, ob sie stimmt. Dass sie vom Hersteller kommt, macht sie nicht zur Wertung.'
              ], ex: 'Getarnte Wertungen: „wirksames Instrument“, „überwiegen deutlich“, „man muss bereit sein“.' },
              { t: 'text', id: 'LA3', q: 'Tippe den Satz an, dessen Begründung nicht trägt (Fehlschluss).', ok: [6], fb: [
                'Hier wird behauptet, nicht begründet. Achte auf „da“, „weil“ oder „also“.',
                'Eine (erfundene) Angabe, aber kein Schluss. Suche ein „da“ oder „weil“.',
                'Der Satz gibt einen Einwand wieder – geschlossen wird hier nichts.',
                'Eine getarnte Wertung, aber kein Fehlschluss. Wo begründet der Text etwas?',
                'Eine Forderung. Man kann sie ablehnen, ein Denkfehler ist sie nicht.',
                'Eine Beschreibung. Der nächste Satz zieht daraus einen Schluss – schau dort.',
                'Fehlschluss: „Mathematisch“ heißt nicht „fair“. Die KI lernt aus Beispieldaten – sind sie einseitig, rechnet sie einseitig weiter. Bei Gesichtserkennung ist belegt, dass manche Gruppen häufiger falsch erkannt werden.',
                'Eine Zahl mit Herkunftsangabe, aber kein Schluss. Der Satz davor enthält ein „da“.'
              ], ex: '„Ohne Vorurteile, da rein mathematisch“ trägt nicht: Einseitige Trainingsdaten führen zu einseitigen Ergebnissen.' }
            ] },
          { t: 'card', opt: 1, ico: 'book', h: 'Dein Fachwissen: Welche Grundrechte sind berührt?',
            info: 'Der KI-Text spricht vage von „Privatsphäre“. Das Grundgesetz ist genauer.',
            items: [
              { t: 'multi', id: 'LA2', q: 'Welche Grundrechte können KI-Kameras auf einem öffentlichen Platz berühren? Wähle alle zutreffenden.', opts: [
                ['Art. 2 Abs. 1 i. V. m. Art. 1 Abs. 1 GG – informationelle Selbstbestimmung', 1, 'berührt – jeder soll selbst bestimmen, welche Daten über ihn erhoben werden'],
                ['Art. 13 GG – Unverletzlichkeit der Wohnung', 0, 'nicht berührt – geschützt ist die Wohnung, nicht der Platz'],
                ['Art. 8 GG – Versammlungsfreiheit', 1, 'berührt – wer sich beobachtet fühlt, bleibt Demonstrationen eher fern'],
                ['Art. 5 Abs. 1 GG – Pressefreiheit', 0, 'hier nicht direkt berührt'],
                ['Art. 3 GG – Gleichheit vor dem Gesetz', 1, 'berührt – wenn das System manche Gruppen häufiger falsch erkennt'],
                ['Art. 12 GG – Berufsfreiheit', 0, 'hier nicht berührt']
              ], fb: 'Im Kern geht es um die informationelle Selbstbestimmung, die das Bundesverfassungsgericht aus Art. 2 Abs. 1 in Verbindung mit Art. 1 Abs. 1 GG ableitet; dazu Versammlungsfreiheit (Art. 8) und Gleichheitssatz (Art. 3). Dem steht die Aufgabe des Staates gegenüber, für Sicherheit zu sorgen – ein Grundrechtskonflikt.',
              ex: 'Berührt sind informationelle Selbstbestimmung, Versammlungsfreiheit und Gleichheitssatz – ein Grundrechtskonflikt mit dem Schutzauftrag des Staates.' }
            ] }
        ], nx: 'Weiter: Dein Analyse-Ergebnis' },

      { id: 'F1P3', sec: 'Fall 1 · Analyse', l: 'Bilanz', bdg: 'Fall 1 · Analysekompetenz', h: 'Dein Analyse-Ergebnis',
        ld: 'Drei Probleme in einem einzigen KI-Text:',
        task: '<strong>Vergleiche</strong> deinen ersten Eindruck mit dem Prüfergebnis.',
        blocks: [
          { t: 'lupen', x: ['Erfundenes Institut mit genauer Zahl (DIUS, 41%)', 'Fast nur Polizei und Innenministerium; Betroffene, Datenschutz und Gerichte fehlen', 'Wertung als Tatsache; Fehlschluss „rein mathematisch = ohne Vorurteile“'] },

      { id: 'F2P1', sec: 'Fall 2 · Urteil', l: 'Framing', bdg: 'Fall 2 · Urteilskompetenz', h: 'Gleiche Zahl, anderer Rahmen',
        ld: 'Dieselbe Information kann je nach Wortwahl für oder gegen etwas sprechen.',
        task: '<strong>Vergleiche</strong> jeweils die beiden Formulierungen.',
        blocks: [
          { t: 'info', x: '<strong>Framing:</strong> Wortwahl und Blickwinkel lenken, wie eine Information wirkt. KI-Texte treffen solche Entscheidungen ständig.' },
          { t: 'card', h: 'Paar 1: Treffer', cap: 'Beispielsätze mit erfundenen Zahlen',
            pair: [['A', 'KI-Kameras: Polizei fand 15% mehr gesuchte Personen.'], ['B', 'KI-Kameras: 15% mehr Menschen wurden als verdächtig gemeldet.']],
            items: [{ t: 'single', id: 'FR1', q: 'Worin unterscheiden sich A und B?', opts: [
              ['Satz A nennt eine größere Zahl als Satz B', 0, 'Die Zahl ist in beiden Sätzen dieselbe: 15%. Der Unterschied liegt in den Wörtern drum herum.'],
              ['A rahmt die Zahl als Fahndungserfolg, B als Eingriff', 1, 'Dieselbe Zahl wird einmal als Erfolg erzählt, einmal als Eingriff – unter den Gemeldeten können Unbeteiligte sein. Das ist Framing.'],
              ['Satz B ist sachlich falsch, Satz A ist sachlich richtig', 0, 'Beide können dieselbe Messung beschreiben. B lenkt den Blick nur auf die Betroffenen statt auf die Polizei.'],
              ['Kein Unterschied – beide Sätze wirken gleich auf Leser', 0, 'Die Zahl ist gleich, die Wirkung nicht: „gesuchte Personen finden“ klingt nach Erfolg, „als verdächtig gemeldet“ nach Eingriff.']
            ], ex: 'Gleiche Zahl, anderer Rahmen: A betont den Erfolg, B den Eingriff.' }] },
          { t: 'card', opt: 1, h: 'Paar 2: Gefühl und Zahl', cap: 'Beispielsätze mit erfundenen Zahlen',
            pair: [['A', '85% fühlen sich auf überwachten Plätzen sicherer.'], ['B', 'Trotz Überwachung sank die Kriminalität nicht deutlich.']],
            items: [
              { t: 'single', id: 'FR2', q: 'Können beide Aussagen gleichzeitig wahr sein?', opts: [
                ['Ja – Sicherheitsgefühl und Kriminalität sind zweierlei', 1, 'Genau: A misst, wie sicher sich Menschen fühlen, B, wie viele Straftaten es gibt. Beides kann auseinanderfallen.'],
                ['Nein – wer sich sicherer fühlt, ist es auch tatsächlich', 0, 'Das Gefühl kann sich ändern, ohne dass es weniger Straftaten gibt – etwa weil die Kameras sichtbar sind.'],
                ['Nein – eine der beiden Aussagen muss falsch sein', 0, 'Sie widersprechen sich nur scheinbar: A handelt vom Gefühl, B von der Zahl der Straftaten.']
              ], ex: 'Ja: Sicherheitsgefühl und Kriminalitätsrate messen Verschiedenes.' },
              { t: 'single', id: 'FR3', q: 'Was folgt daraus für dein Urteil?', opts: [
                ['Das Sicherheitsgefühl reicht als Begründung für Kameras aus', 0, 'Das Gefühl ist ein wichtiger Gesichtspunkt – sagt aber nichts darüber, ob Straftaten verhindert werden.'],
                ['Sinkt die Kriminalität nicht, gehören die Kameras sofort abgeschafft', 0, 'Nicht unbedingt: Auch das Sicherheitsgefühl kann ein Ziel sein. Ob das einen Grundrechtseingriff rechtfertigt, ist eine Frage der Gewichtung.'],
                ['Ein Urteil muss Gefühl und messbare Wirkung unterscheiden', 1, 'Erst klären, was genau gemessen wurde – dann entscheiden, was einem wichtiger ist.'],
                ['Gefühl und Fakten lassen sich hier grundsätzlich nicht trennen', 0, 'Doch: Das Gefühl lässt sich erfragen, Straftaten lassen sich zählen. Diese Trennung macht ein Urteil nachvollziehbar.']
              ], ex: 'Ein Urteil trennt Sicherheitsgefühl und messbare Wirkung – und gewichtet dann.' }
            ] }
        ], nx: 'Weiter: Aussagen einordnen', nxc: 'b2' },

      { id: 'F2P2', sec: 'Fall 2 · Urteil', l: 'Aussagen', bdg: 'Fall 2 · Urteilskompetenz', h: 'Versteckte Wertungen erkennen',
        ld: 'Ein Satz, den man in der Debatte oft hört.',
        task: '<strong>Ordne</strong> die Aussage <strong>ein</strong>.',
        blocks: [
          { t: 'help', h: 'Tatsachenbehauptung, Werturteil, Fehlschluss – was ist was?', x: TRIO_HTML },
          { t: 'card', st: 'Wer nichts zu verbergen hat, braucht Überwachung nicht zu fürchten.', items: [
            { t: 'single', id: 'SW2', fix: 1, q: '', opts: [
            ['Tatsachenbehauptung', 0, 'Der Satz klingt wie eine Feststellung, enthält aber einen Schluss: von „nichts zu verbergen“ auf „nichts zu fürchten“. Trägt der?'],
            ['Werturteil', 0, 'Dahinter steckt eine Haltung – der Satz selbst ist aber als Schluss gebaut („wer …, der …“). Prüfe, ob er trägt.'],
            ['Fehlschluss', 1, 'Fehlschluss: Der Satz unterstellt, nur Schuldige bräuchten Privatsphäre. Grundrechte schützen aber alle – und auch Unschuldige können falsch erkannt werden.']
            ], ex: 'Fehlschluss: Grundrechte schützen alle, nicht nur Menschen „mit etwas zu verbergen“.' }
          ] },
          { t: 'card', opt: 1, h: 'Zwei weitere Aussagen einordnen', items: [
            { t: 'single', id: 'SW1', fix: 1, q: '„Die Fehlerquote der Software liegt laut Hersteller bei unter 2%.“', opts: [
            ['Tatsachenbehauptung', 1, 'Die Quote lässt sich nachmessen. Aber: Die Quelle ist der Hersteller, nicht unabhängig. Prüfbar heißt noch nicht geprüft.'],
            ['Werturteil', 0, 'Hier wird nichts als gut oder schlecht bewertet. Der Satz nennt eine Zahl, die man nachmessen könnte.'],
            ['Fehlschluss', 0, 'Der Satz zieht keinen Schluss – er nennt nur eine Zahl. Ob sie stimmt, ist eine andere Frage.']
            ], ex: 'Tatsachenbehauptung – prüfbar, aber vom Hersteller, also nicht unabhängig.' },
            { t: 'single', id: 'SW3', fix: 1, q: '„Eine demokratische Gesellschaft muss das Recht auf Anonymität schützen.“', opts: [
            ['Tatsachenbehauptung', 0, 'Achte auf das „muss“: Der Satz beschreibt nicht, was ist, sondern fordert, was sein soll.'],
            ['Werturteil', 1, 'Werturteil: eine Forderung, gut begründbar, aber keine überprüfbare Tatsache.'],
            ['Fehlschluss', 0, 'Ein Denkfehler steckt nicht darin. Der Satz stellt eine Forderung auf – man kann sie teilen oder nicht.']
            ], ex: 'Werturteil – eine Forderung („muss“), keine Tatsache.' }
          ] }
        ], nx: 'Weiter: Dein Urteil', nxc: 'b2' },

      { id: 'F2P3', sec: 'Fall 2 · Urteil', l: 'Dein Urteil', bdg: 'Fall 2 · Urteilskompetenz', h: 'Dein Urteil',
        ld: 'Erst spontan, dann mit Kriterien.',
        task: '<strong>Bewerte</strong>, ob Baden-Württemberg KI-Kameras mit Gesichtserkennung erproben soll.',
        blocks: [
          { t: 'pos', cap: 'Bisher erkennen die Kameras in Mannheim nur Bewegungen. Neu wäre der Abgleich von Gesichtern mit Fahndungsdaten.' },
          { t: 'voices', items: [
            { t: 'single', id: 'LM1', q: 'Warum urteilen Lena und Moritz verschieden?', opts: [
              ['Moritz argumentiert nur persönlich, Lena mit Grundrechten – ihr Urteil zählt mehr', 0, 'Persönliche Erfahrung ist kein Schwachpunkt: Das Sicherheitsgefühl ist ein legitimer Gesichtspunkt. Der Unterschied liegt woanders.'],
              ['Lena unterschätzt, dass die Technik die Fehler bald selbst lösen wird', 0, 'Dass die Technik besser wird, ist Moritz’ Erwartung – keine Tatsache. Beide kennen dieselben Fakten.'],
              ['Sie gewichten die Kriterien verschieden: Moritz Effektivität, Lena Legalität', 1, 'Moritz stellt die Effektivität nach vorn, Lena Legalität, Gerechtigkeit und Transparenz. Beide Gewichtungen sind begründbar – das macht politische Kontroversen aus.'],
              ['Lena nennt mehr Kriterien als Moritz und urteilt deshalb differenzierter und besser', 0, 'Mehr Kriterien heißt nicht automatisch besser. Entscheidend ist, wie man gewichtet – und ob man es offenlegt.']
            ], ex: 'Beide kennen dieselben Fakten, gewichten die Kriterien aber verschieden – keiner liegt automatisch richtig.' }
          ] },
          { t: 'card', opt: 1, h: 'Ein schwaches Argument finden', items: [
            { t: 'single', id: 'LM2', q: 'Einen Satz von Moritz hast du schon als Fehlschluss eingeordnet. Welcher ist es?', opts: [
              ['„Meine Oma traut sich abends nicht auf den Marktplatz.“', 0, 'Eine persönliche Erfahrung. Als Beispiel ist sie erlaubt – sie beweist nichts für alle, ist aber kein Denkfehler.'],
              ['„Natürlich muss das System fair sein, aber die Technik wird besser.“', 0, 'Eine Erwartung an die Zukunft: unsicher, aber kein Fehlschluss.'],
              ['„Wenn die Kameras gesuchte Straftäter finden, ist das ein Gewinn.“', 0, 'Hier gewichtet Moritz die Effektivität – ein zulässiges Werturteil.'],
              ['„Wer sich an Regeln hält, hat nichts zu befürchten.“', 1, 'Das ist der Fehlschluss aus dem letzten Schritt, anders formuliert. Moritz’ Gewichtung bleibt legitim – dieses Argument trägt sie aber nicht.']
            ], ex: '„Wer sich an Regeln hält, hat nichts zu befürchten“ – derselbe Fehlschluss wie „Wer nichts zu verbergen hat …“.' }
          ] },
          { t: 'weights', cap: 'Die vier Kriterien stammen aus dem Bildungsplan Gemeinschaftskunde.' },
          { t: 'final', x: '<strong>Kein Richtig oder Falsch – aber bewusst oder unbewusst.</strong> Ob KI-Kameras Straftaten verhindern, ist eine Sachfrage. Ob das Land sie erproben soll, hängt davon ab, wie du die Kriterien gewichtest. Was in Politik und Wissenschaft kontrovers ist, bleibt im Unterricht kontrovers.' }
        ], nx: 'Weiter: Fall 3', nxc: 'b2' },

      { id: 'F3P1', sec: 'Fall 3 · Methode', l: 'Prompten', bdg: 'Fall 3 · Methodenkompetenz', h: 'Selbst mit KI arbeiten',
        ld: 'Ihr bereitet eine Podiumsdiskussion zu den KI-Kameras vor.',
        task: '<strong>Vergleiche</strong> die vier Prompts.',
        blocks: [
          { t: 'card', h: 'Den besten Prompt wählen',
            info: '<strong>Trained-to-Please:</strong> Chatbots wollen gefallen und folgen der Richtung deiner Frage. Einseitiger Prompt – einseitige Antwort.',
            items: [{ t: 'single', id: 'PR1', q: 'Welcher Prompt liefert das ausgewogenste Ergebnis?', opts: [
              ['Schreibe einen überzeugenden Text, warum KI-Kameras mit Gesichtserkennung auf öffentlichen Plätzen sinnvoll sind. Nutze Beispiele und Statistiken.', 0, 'Dieser Prompt bestellt nur eine Seite – und die KI liefert sie. „Nutze Statistiken“ lädt außerdem zum Erfinden ein.'],
              ['Verfasse eine kritische Analyse, die zeigt, dass KI-Kameras mit Gesichtserkennung gegen die Menschenwürde verstoßen. Beziehe dich auf das Grundgesetz.', 0, 'Das Ergebnis steht schon im Prompt („die zeigt, dass …“). Die KI bestätigt es – Trained-to-Please in die andere Richtung.'],
              ['Nenne die drei stärksten Argumente für und gegen KI-Kameras mit Gesichtserkennung auf öffentlichen Plätzen. Berücksichtige Polizei, Datenschutz und betroffene Bürger.', 1, 'Er fordert Pro und Contra und drei Akteure – und gibt kein Ergebnis vor. Trotzdem: Auch diese Antwort musst du prüfen.'],
              ['Stelle die Argumente für und gegen KI-Kameras mit Gesichtserkennung dar und erkläre, warum die Sicherheit am Ende schwerer wiegt. Berücksichtige Polizei und Datenschutz.', 0, 'Wirkt ausgewogen, gibt aber das Ergebnis vor („warum die Sicherheit schwerer wiegt“). Die KI landet dort, wo der Prompt sie hinschickt.']
            ], ex: 'Der Prompt mit Pro und Contra, drei Akteuren und ohne vorgegebenes Ergebnis.' }] },
          { t: 'run' }
        ] },

      { id: 'F3P2', sec: 'Fall 3 · Methode', l: 'Checkliste', bdg: 'Fall 3 · Methodenkompetenz', h: 'Prüf-Checkliste',
        ld: 'Prüfe die KI-Antwort mit allem, was du in Fall 1 und 2 geübt hast.',
        task: '<strong>Überprüfe</strong> die KI-Antwort mit der Checkliste.',
        blocks: [
          { t: 'info', x: '<strong>Black-Box:</strong> Du siehst nicht, wie die KI zu ihrer Antwort kommt. Verlass dich auf dein Prüfverfahren, nicht auf den guten Klang.' },
          { t: 'paste' },
          { t: 'check', items: [
            ['cl1', 'Nennt die KI konkrete Rechtsgrundlagen?', [['Ja', 'Gut – prüfe, ob die genannten Artikel und Gesetze stimmen und passen.', 0], ['Nein', 'Warnsignal: Ohne Rechtsgrundlage bleibt die Antwort oberflächlich. Ergänze selbst (Grundgesetz, Polizeigesetz).', 1], ['Unsicher', 'Schlage die Grundgesetz-Artikel nach und vergleiche.', 1]], [1, 'In der Beispielantwort steht kein Grundgesetz-Artikel und kein Gesetz.']],
            ['cl2', 'Kommen mindestens zwei Akteure zu Wort?', [['Ja', 'Gut – prüfe, ob sie gleich viel Raum und gleich starke Argumente bekommen.', 0], ['Nein', 'Typisches Bias-Problem: Nur die häufigste Sicht wurde übernommen.', 1]], [0, 'Polizei, Datenschützer sowie Bürgerinnen und Bürger kommen vor.']],
            ['cl3', 'Gibt es Quellenangaben?', [['Ja, überprüfbare', 'Sehr gut – trotzdem stichprobenartig nachschlagen.', 0], ['Ja, aber nicht prüfbar', 'Vorsicht: „Studien zeigen …“ kann halluziniert sein.', 1], ['Nein', 'Dann ist nichts davon zitierfähig – suche die Belege selbst.', 1]], [1, '„Studien zeigen …“ – welche Studien? Das ist keine prüfbare Quelle.']],
            ['cl4', 'Welche KI-Falle fällt dir am stärksten auf?', [['Halluzination', 'Prüfe Fakten, Zahlen und Namen an der Originalquelle.', 0], ['Bias', 'Fordere mit einem neuen Prompt die fehlende Perspektive ein.', 0], ['Trained-to-Please', 'Die KI ist vermutlich der Richtung deiner Frage gefolgt. Fordere Gegenargumente ein.', 0], ['Black-Box', 'Dann ist die Gegenrecherche mit unabhängigen Quellen besonders wichtig.', 0], ['Keine', 'Bleib skeptisch – prüfe mindestens eine Angabe nach.', 1]]],
            ['cl5', 'Was ist dein nächster Schritt?', [['Text direkt übernehmen', 'Vorsicht! KI-Texte nie ungeprüft übernehmen.', 1], ['Zentrale Aussagen gegenchecken', 'Genau richtig – unabhängige Quellen sind der Maßstab.', 0], ['Die KI fragen, ob alles stimmt', 'Unzuverlässig – die KI bestätigt oft ihre eigenen Fehler.', 1], ['Fehlende Perspektiven nachrecherchieren', 'Sehr guter Ansatz.', 0]]]
          ] }
        ], nx: 'Weiter: KI-Logbuch' },

      { id: 'F3P3', sec: 'Fall 3 · Methode', l: 'KI-Logbuch', bdg: 'Fall 3 · Methodenkompetenz', h: 'KI-Logbuch',

        }], nx: 'Abschließen: Zusammenfassung', nxc: 'b2' }
