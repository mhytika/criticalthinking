      ['Eigenverantwortung', 'Entscheide ich als Verbraucher selbst, welche Dienste ich nutze?']
    ],
    werte: ['Freiheit', 'Gerechtigkeit', 'Sicherheit', 'Wohlstand'],
    voices: [
      { n: 'Aylin', p: 'klar dafür', w: [1, 3, 5, 1], x: 'Ich habe das Recht zu wissen, womit ein Unternehmen Geld verdient – Transparenz ist die Grundlage für faire Verbraucherentscheidungen. Es kann nicht effizient sein, wenn ein Geschäftsmodell darauf baut, dass Nutzer es nicht durchschauen. Und es ist ungerecht, wenn manche Nutzer stärker vom Algorithmus manipuliert werden als andere.' },
      { n: 'Jan', p: 'eher dagegen', w: [4, 1, 1, 4], x: 'Wenn der Staat jedes Geschäftsmodell regeln will, erstickt er Innovation – das schadet der Effizienz. Niemand zwingt mich, die Plattform zu nutzen – ich trage die Eigenverantwortung. Solange das Unternehmen die Gesetze einhält, ist es gerecht genug. Transparenz wäre nett, aber keine Pflicht.' }
    ],
    prompt: 'Erkläre das Geschäftsmodell kostenloser Social-Media-Plattformen. Wer verdient wie Geld? Welche Vor- und Nachteile haben Nutzer, Unternehmen und die Gesellschaft?',
    sample: 'Kostenlose Social-Media-Plattformen verdienen ihr Geld meist nicht bei den Nutzern, sondern bei anderen Unternehmen. Die wichtigste Einnahmequelle ist Werbung: Die Plattform wertet aus, was Nutzer ansehen und anklicken, und verkauft Werbeplätze, die zu diesen Interessen passen. Weitere Einnahmen können Bezahl-Abos ohne Werbung, Gebühren für Händler oder Geld von Investoren sein.\n\nVorteile: Nutzer zahlen kein Geld und erreichen viele Menschen. Unternehmen können gezielt werben. Die Gesellschaft gewinnt neue Möglichkeiten zum Austausch.\n\nNachteile: Nutzer geben viele persönliche Daten preis und verbringen oft mehr Zeit auf der Plattform als geplant. Kleine Anbieter haben es schwer gegen große Plattformen. Falschinformationen können sich schnell verbreiten.\n\nExperten sind sich einig, dass die Vorteile für die meisten Nutzer überwiegen.',
    steps: [
      { id: 'W1P1', sec: 'Fall 1 · Analyse', l: 'Sichten', bdg: 'Fall 1 · Analysekompetenz', h: 'Der KI-Text: erster Eindruck',
        ld: 'Eine neue Plattform wirbt: komplett kostenlos und werbefrei. Ihr habt eine KI gebeten, das Geschäftsmodell zu erklären.',
        task: '<strong>Ordne</strong> jedem Absatz spontan eine Ampelfarbe <strong>zu</strong>.',
        blocks: [{ t: 'ampel' }], nx: 'Weiter: Genauer prüfen' },

      { id: 'W1P2', sec: 'Fall 1 · Analyse', l: 'Analysieren', bdg: 'Fall 1 · Analysekompetenz', h: 'Drei Lupen',
        ld: 'Jetzt langsam und gründlich: Jede Lupe sucht ein anderes Problem.',
        task: '<strong>Überprüfe</strong> den KI-Text mit den drei Lupen.',
        blocks: [
          { t: 'card', cls: 'lt', ico: 'search', h: 'Technik-Lupe: Erfundene Fakten',
            info: '<strong>Halluzination:</strong> KI erfindet manchmal Quellen, Zahlen oder Fakten – und klingt dabei überzeugend.',
            items: [
              { t: 'text', id: 'WLT1', ex: 'Ein „Fraunhofer-Institut für Digitale Medienökonomie“ gibt es nicht – seriöse Marke plus erfundene Spezialisierung.', q: 'Tippe den Satz an, der eine erfundene Quelle enthalten könnte.', ok: [2], fb: [
                'Das ist Werbesprache („revolutioniert“), aber keine Quelle. Gesucht ist eine Angabe, die du nachschlagen kannst.',
                'Die 12 Millionen sind unbelegt – der Satz nennt dafür aber keine Quelle, die du nachschlagen könntest. Ein anderer Satz schon.',
                'Ein Fraunhofer-Institut für Digitale Medienökonomie gibt es nicht. Es gibt zwar viele Fraunhofer-Institute (etwa eines für Digitale Medientechnologie), aber keines mit diesem Namen. Typische Halluzination: seriös klingende Marke plus erfundene Spezialisierung.',
                'Eigenlob ohne Quelle („hochmodern“, „perfekt“). Wo beruft sich der Text auf eine Einrichtung?',
                'Die 47 Minuten können stimmen oder nicht – woher sie kommen, sagt der Text nicht. Ein anderer Satz nennt eine Quelle, die sich sofort überprüfen lässt.',
                'Das ist ein Versprechen des Unternehmens. Prüfen müsstest du es in der Datenschutzerklärung – eine erfundene Quelle steckt hier aber nicht drin.',
                'Eine Selbstbeschreibung, keine Quellenangabe. Suche nach dem Namen einer Einrichtung.',
                'Eine Behauptung über eine Funktion – prüfbar, aber ohne Quellenangabe. Wo nennt der Text ein Institut?'
              ] },
              { t: 'single', id: 'WLT2', ex: 'Die offizielle Institutsliste auf fraunhofer.de zeigt sofort, ob es das Institut gibt.', q: 'Wie überprüfst du am zuverlässigsten, ob dieses Institut existiert?', opts: [
                ['Die KI nochmal fragen, ob die Quelle stimmt', 0, 'Unzuverlässig: Die KI bestätigt oft ihre eigenen Erfindungen. Du brauchst eine Quelle außerhalb der KI.'],
                ['Auf der offiziellen Fraunhofer-Website die Institutsliste prüfen', 1, 'Genau – die offizielle Website (fraunhofer.de) listet alle echten Institute auf. Dort siehst du sofort, ob ein genanntes Institut existiert.'],
                ['Dem Text vertrauen, weil Fraunhofer eine bekannte Forschungsorganisation ist', 0, 'Genau darauf setzt die Halluzination: Ein bekannter Name macht eine erfundene Quelle glaubwürdig. Der gute Ruf beweist nicht, dass es dieses Institut gibt.'],
                ['In sozialen Medien nachfragen, ob jemand das Institut kennt', 0, 'Dort bekommst du Meinungen, keine Belege. Schneller und sicherer ist die Liste der Organisation selbst.']
              ] }
            ] },
          { t: 'card', cls: 'lg', ico: 'people', h: 'Gesellschafts-Lupe: Fehlende Perspektiven', kit: 1,
            info: '<strong>Bias:</strong> KI gibt oft wieder, was in ihren Trainingsdaten häufig vorkommt. Seltenere Sichtweisen fehlen – der Text ist verzerrt.',
            items: [
              { t: 'single', id: 'WLG1', ex: 'Der Text klingt wie eine Pressemitteilung des Unternehmens.', q: 'Aus wessen Perspektive klingt der Text?', opts: [
                ['Aus der Perspektive einer unabhängigen Verbraucherberatung', 0, 'Eine Verbraucherberatung würde Risiken und offene Fragen nennen. Im Text gibt es keine einzige kritische Anmerkung.'],
                ['Aus der Perspektive der Marketingabteilung des Unternehmens', 1, 'Der Text klingt wie eine Pressemitteilung des Unternehmens. Alle Aussagen stellen ConnectFree positiv dar, kritische Fragen werden gar nicht erst gestellt.'],
                ['Aus der Perspektive von Datenschutzexpertinnen und -experten', 0, 'Datenschutz kommt zwar vor – aber nur als Eigenlob („wird großgeschrieben“). Fachleute würden fragen, welche Daten erhoben werden und wofür.'],
                ['Aus einer wissenschaftlich-neutralen Perspektive', 0, 'Wörter wie „revolutioniert“, „perfekt“ und „hochmodern“ sind Werbesprache. Eine neutrale Analyse würde auch Nachteile und Unsicherheiten nennen.']
              ] },
              { t: 'multi', id: 'WLG2', q: 'Welche Perspektiven fehlen im Text? Wähle alle zutreffenden.', opts: [
                ['Verbraucherschutzorganisationen (z.B. Verbraucherzentrale)', 1, 'fehlen – sie würden nach Kosten und Risiken für Nutzer fragen'],
                ['Das Unternehmen ConnectFree selbst', 0, 'ist vertreten – der ganze Text spricht in seinem Sinn'],
                ['Datenschutzbeauftragte', 1, 'fehlen – „großgeschrieben“ ist keine unabhängige Prüfung'],
                ['Suchtforschende und Medienpädagogen', 1, 'fehlen – sie würden die 47 Minuten anders deuten'],
                ['Nutzerinnen und Nutzer, die negative Erfahrungen gemacht haben', 1, 'fehlen – Nutzer kommen nur als „zufrieden“ vor'],
                ['Wettbewerbsbehörden (die prüfen, ob der Markt fair funktioniert)', 1, 'fehlen – „revolutioniert den Markt“ bleibt ungeprüft']
              ], ex: 'Verbraucherschutz, Datenschutz, Suchtforschung, enttäuschte Nutzer und Wettbewerbsbehörden fehlen.', fb: 'Der Text verschweigt alle kritischen Perspektiven: Verbraucherschutz, Datenschutz, Suchtforschung, negative Nutzererfahrungen und Wettbewerbsprüfung kommen nicht vor.' }
            ] },
          { t: 'card', cls: 'la', ico: 'scale', h: 'Anwendungs-Lupe: Fakt oder Wertung?',
            info: TRIO_HTML,
            items: [
              { t: 'text', id: 'WLA2', ex: 'Aus 47 Minuten Nutzung folgt nicht Zufriedenheit – lange Nutzung kann auch Gewohnheit oder Sog sein.', q: 'Tippe den Satz an, der aus einer Zahl einen Schluss zieht, der nicht trägt (Fehlschluss).', ok: [4], fb: [
                'Eine Wertung („revolutioniert“), aber kein Schluss. Gesucht ist ein Satz, der aus einer Angabe etwas ableitet.',
                'Behauptungen über das Angebot – abgeleitet wird daraus nichts. Suche eine Zahl, aus der etwas gefolgert wird.',
                'Die erfundene Quelle kennst du aus der Technik-Lupe. Ein Schluss aus einer Zahl steckt hier aber nicht.',
                'Eigenlob über den Algorithmus. Der Satz danach zieht daraus eine Folgerung – schau dort.',
                'Die 47 Minuten sind eine Tatsachenbehauptung: Sie stimmen oder sie stimmen nicht. Der Schluss daraus trägt aber nicht: Lange Nutzung beweist keine Zufriedenheit. Sie kann auch an Gewohnheit liegen oder an einer Gestaltung, die zum Weiterscrollen verleitet.',
                'Ein Versprechen zum Datenschutz. Es wird behauptet, nicht geschlossen.',
                'Eine Selbstbeschreibung ohne Zahl und ohne Schluss.',
                'Eine Behauptung – ob der Wechsel wirklich so leicht ist, prüfst du gleich. Gesucht ist ein Satz mit einer Zahl und einer Folgerung daraus.'
              ] },
              { t: 'single', id: 'WLE', ex: '„Community-Ansatz“ erklärt nicht, wer bezahlt – die größte Lücke im Text.', q: 'Laut Text beruht das Geschäftsmodell auf einem „innovativen Community-Ansatz“. Was erfährst du daraus, womit ConnectFree Geld verdient?', opts: [
                ['Dass die Community die Plattform freiwillig mit Spenden finanziert', 0, 'Das steht nirgends – es ist deine Vermutung. Der Begriff lädt dazu ein, sich selbst etwas Passendes auszudenken.'],
                ['Dass ConnectFree heimlich mit den Daten seiner Nutzer Geld verdient', 0, 'Bei kostenlosen Plattformen ist das häufig so – im Text steht es aber nicht. Absatz 3 behauptet sogar das Gegenteil. Du weißt es also nicht, und genau das ist der Befund.'],
                ['Nichts – der Begriff erklärt nicht, woher das Geld kommt', 1, 'Das ist die größte Lücke im Text. Eine Plattform mit 12 Millionen Nutzern kostet viel Geld. Wenn weder Werbung noch Gebühren noch Daten Geld bringen sollen, bleibt offen: Wer bezahlt? Denkbar sind Investoren, später Werbung oder Abos, die Auswertung von Daten. Welche Erklärung stimmt, musst du prüfen – nicht raten.'],
                ['Dass das Unternehmen auf Gewinn verzichtet und nur seine Kosten deckt', 0, 'Auch das steht nicht im Text. „Community-Ansatz“ sagt nichts über Gewinnabsichten.']
              ] }
            ] },
          { t: 'card', opt: 1, ico: 'book', h: 'Dein Fachwissen: Wie leicht ist ein Wechsel wirklich?', items: [
              { t: 'multi', id: 'WLC', ex: 'Wechselkosten: Kontakte, Gewohnheiten und unpassende Formate halten Nutzer fest.', q: 'Der Text behauptet, Nutzer können ihr Profil jederzeit übertragen. Warum könnte ein Wechsel in der Realität trotzdem schwierig sein? Wähle alle zutreffenden.', opts: [
                ['Weil die Internetverbindung zu langsam ist', 0, 'trifft nicht zu – daran scheitert ein Wechsel nicht'],
                ['Weil alle Kontakte, Chatverläufe und Gewohnheiten auf der Plattform bleiben – ein Wechsel fühlt sich wie ein Verlust an', 1, 'trifft zu – eine Plattform ist so viel wert wie die Menschen, die dort sind'],
                ['Weil andere Plattformen ein anderes Format verwenden und die Daten nicht kompatibel sind', 1, 'trifft zu – übertragbar heißt nicht, dass es woanders passt'],
                ['Weil das Unternehmen den Export technisch komplett blockiert', 0, 'trifft nicht zu – das stünde im Widerspruch zum Text und zum Datenschutzrecht']
              ], fb: 'Das nennt man Wechselkosten. Auch wenn ein Umzug technisch möglich ist, sind die versteckten Kosten (Kontaktverlust, Gewohnheit, Inkompatibilität) so hoch, dass die meisten Nutzer bleiben. Rechtlich gibt es sogar ein Recht auf Datenübertragbarkeit (Art. 20 DSGVO) – die Freunde ziehen trotzdem nicht mit um.' }
            ] }
        ], nx: 'Weiter: Dein Analyse-Ergebnis' },

      { id: 'W1P3', sec: 'Fall 1 · Analyse', l: 'Bilanz', bdg: 'Fall 1 · Analysekompetenz', h: 'Dein Analyse-Ergebnis',
        ld: 'Drei Probleme in einem einzigen KI-Text:',
        task: '<strong>Vergleiche</strong> deinen ersten Eindruck mit dem Prüfergebnis.',
        blocks: [
          { t: 'lupen', x: ['Nicht existierendes Fraunhofer-Institut', 'Marketing statt Analyse, kritische Stimmen fehlen', 'Fehlschluss: Nutzungsdauer ≠ Zufriedenheit; Geschäftsmodell nicht erklärt'] },
          { t: 'ampcmp' },
          { t: 'info', x: '<strong>Merke:</strong> Die beste Frage bei jedem kostenlosen Angebot: Wer bezahlt – und womit?' }
        ], nx: 'Weiter: Fall 2', nxc: 'b2' },

      { id: 'W2P1', sec: 'Fall 2 · Urteil', l: 'Framing', bdg: 'Fall 2 · Urteilskompetenz', h: 'Gleicher Vorgang, anderer Rahmen',
        ld: 'Derselbe Vorgang kann je nach Wortwahl als Chance oder Gefahr wirken.',
        task: '<strong>Vergleiche</strong> jeweils die beiden Formulierungen.',
        blocks: [
          { t: 'info', x: '<strong>Framing:</strong> Wortwahl und Blickwinkel lenken, wie eine Information wirkt. KI-Texte treffen solche Entscheidungen ständig.' },
          { t: 'card', h: 'Paar 1: Kostenlos?',
            pair: [['A', 'ConnectFree bietet 12 Millionen Nutzern einen kostenlosen Service – ein Beweis für das innovative Geschäftsmodell.'], ['B', '12 Millionen Menschen stellen ConnectFree täglich ihre persönlichen Daten, Vorlieben und Kontakte zur Verfügung – kostenlos.']],
            items: [{ t: 'single', id: 'WFR1', ex: 'A erzählt, was Nutzer bekommen, B, was sie geben – „kostenlos“ wechselt die Seite.', q: 'Worin unterscheiden sich A und B?', opts: [
              ['Satz A ist optimistischer formuliert, aber inhaltlich sagen beide Sätze genau dasselbe', 0, 'Nicht nur der Ton ist anders: A erzählt, was die Nutzer bekommen, B, was sie geben. Wer gibt hier wem etwas?'],
              ['In A bekommen Nutzer etwas geschenkt, in B liefern sie etwas: ihre Daten', 1, 'Gleiches Geschäftsmodell, umgekehrte Blickrichtung: In A schenkt das Unternehmen, in B schenken die Nutzer. Das Wort „kostenlos“ wechselt dabei die Seite.'],
              ['Satz B ist sachlich falsch, weil Nutzer keine Daten zur Verfügung stellen', 0, 'Doch: Wer eine Plattform nutzt, hinterlässt dort Angaben, Vorlieben und Kontakte. B beschreibt denselben Vorgang wie A – nur von der anderen Seite.'],
              ['Satz A ist die Unternehmensperspektive, Satz B ist übertrieben und unsachlich', 0, 'B wertet nicht stärker als A („ein Beweis für das innovative Geschäftsmodell“ ist auch eine Wertung). Beide rahmen denselben Vorgang – nur verschieden.']
            ] }] },
          { t: 'card', opt: 1, h: 'Paar 2: Algorithmus',
            pair: [['A', 'Der Algorithmus sorgt dafür, dass Nutzer genau die Inhalte sehen, die sie interessieren – ein personalisiertes Erlebnis.'], ['B', 'Der Algorithmus ist darauf optimiert, dass Nutzer möglichst lange auf der Plattform bleiben – jede Minute bedeutet mehr Daten und Einnahmen.']],
            items: [
              { t: 'single', id: 'WFR2', ex: 'Ja: Ein Algorithmus kann zeigen, was interessiert – und gerade dadurch länger halten.', q: 'Können beide Aussagen gleichzeitig wahr sein?', opts: [
                ['Ja – Personalisierung und Verweildauer-Maximierung sind zwei Seiten derselben Medaille', 1, 'Der Algorithmus kann beides gleichzeitig tun: zeigen, was interessiert – und damit erreichen, dass man länger bleibt.'],
                ['Nein – ein Algorithmus, der wirklich im Interesse der Nutzer arbeitet, würde die Nutzungszeit bewusst begrenzen', 0, 'Das wäre ein Wunsch an den Algorithmus, kein Widerspruch zwischen A und B. Interessante Inhalte zeigen und lange halten schließen sich nicht aus.'],
                ['Nein – Personalisierung dient immer den Nutzern, Verweildauer-Maximierung immer dem Unternehmen, beides zusammen ist ein Widerspruch', 0, 'Doch, beides kann stimmen: Personalisierung KANN Nutzern helfen UND gleichzeitig die Verweildauer erhöhen. „Immer“ ist hier zu einfach.']
              ] },
              { t: 'single', id: 'WFR3', ex: 'Wer das Geschäftsmodell durchschaut, kann bewusst entscheiden.', q: 'Was bedeutet das für dich als Verbraucher?', opts: [
                ['Solange mir die Inhalte gefallen, ist der Tausch für mich fair', 0, 'Ob der Tausch fair ist, kannst du erst beurteilen, wenn du weißt, was du gibst. Gefallen allein sagt darüber nichts.'],
                ['Mein Nutzungsverhalten ist Teil des Geschäftsmodells', 1, 'Genau – erst wer das Geschäftsmodell durchschaut, kann bewusst entscheiden: nutzen, anders nutzen oder lassen.'],
                ['Weil meine Freunde dort sind, kann ich meine Nutzung nicht steuern', 0, 'Der Druck ist real, aber du bist ihm nicht ausgeliefert: Wie lange und wofür du die Plattform nutzt, entscheidest du mit.'],
                ['Der Algorithmus kennt mich besser als ich mich selbst – ein Vorteil', 0, 'Er kennt, was dich am Bildschirm hält – das ist nicht dasselbe wie das, was dir wichtig ist. Weder blindes Vertrauen noch totale Ablehnung hilft weiter.']
              ] }
            ] }
        ], nx: 'Weiter: Aussagen einordnen', nxc: 'b2' },

      { id: 'W2P2', sec: 'Fall 2 · Urteil', l: 'Aussagen', bdg: 'Fall 2 · Urteilskompetenz', h: 'Versteckte Wertungen erkennen',
        ld: 'Ein Satz, den man in der Debatte oft hört.',
        task: '<strong>Ordne</strong> die Aussage <strong>ein</strong>.',
        blocks: [
          { t: 'help', h: 'Tatsachenbehauptung, Werturteil, Fehlschluss – was ist was?', x: TRIO_HTML },
          { t: 'card', st: 'Wenn ein Dienst kostenlos ist, dann ist er auch fair.', items: [
            { t: 'single', id: 'WLA3b', fix: 1, ex: 'Fehlschluss: Auch ohne Geldpreis bezahlt man – mit Daten oder Aufmerksamkeit.', q: '', opts: [
            ['Tatsachenbehauptung', 0, 'Der Satz ist als Schluss gebaut („wenn …, dann …“). Folgt aus „kostenlos“ wirklich „fair“?'],
            ['Werturteil', 0, '„Fair“ ist zwar ein Wertwort – der Satz leitet es aber aus „kostenlos“ ab. Prüfe diese Ableitung.'],
            ['Fehlschluss', 1, 'Fehlschluss! Kostenlos bedeutet nicht fair. Auch ohne Geldpreis kann man bezahlen – etwa mit Daten oder Aufmerksamkeit.']
            ] }
          ] },
          { t: 'card', opt: 1, h: 'Zwei weitere Aussagen einordnen', items: [
            { t: 'single', id: 'WLA3a', fix: 1, ex: 'Tatsachenbehauptung – nachzählbar; registriert heißt aber nicht aktiv.', q: '„ConnectFree hat 12 Millionen registrierte Nutzer.“', opts: [
            ['Tatsachenbehauptung', 1, 'Die Nutzerzahl lässt sich überprüfen. Aber: Registriert heißt nicht unbedingt aktiv!'],
            ['Werturteil', 0, 'Bewertet wird hier nichts – der Satz nennt eine Zahl, die sich nachzählen ließe.'],
            ['Fehlschluss', 0, 'Der Satz zieht keinen Schluss, er nennt nur eine Zahl.']
            ] },
            { t: 'single', id: 'WLA3c', fix: 1, ex: 'Werturteil – eine politische Forderung („sollten“).', q: '„Plattformen sollten gesetzlich verpflichtet werden, ihr Geschäftsmodell verständlich offenzulegen.“', opts: [
            ['Tatsachenbehauptung', 0, 'Achte auf das „sollten“: Der Satz beschreibt nicht, was ist, sondern fordert, was sein soll.'],
            ['Werturteil', 1, 'Werturteil – eine politische Forderung, keine überprüfbare Tatsache.'],
            ['Fehlschluss', 0, 'Ein Denkfehler steckt nicht darin. Der Satz stellt eine Forderung auf – man kann sie teilen oder nicht.']
            ] }
          ] }
        ], nx: 'Weiter: Dein Urteil', nxc: 'b2' },

      { id: 'W2P3', sec: 'Fall 2 · Urteil', l: 'Dein Urteil', bdg: 'Fall 2 · Urteilskompetenz', h: 'Dein Urteil',
        ld: 'Erst spontan, dann mit Kriterien.',
        task: '<strong>Bewerte</strong>, ob der Staat Plattformen wie ConnectFree strenger regulieren sollte.',
        blocks: [
          { t: 'pos', cap: 'Schon heute gelten Regeln, zum Beispiel die Datenschutz-Grundverordnung und das EU-Gesetz über digitale Dienste. „Strenger“ heißt: darüber hinaus.' },
          { t: 'voices', items: [
            { t: 'single', id: 'WAJ1', ex: 'Beide begründen nachvollziehbar, aber mit unterschiedlichen Wertprioritäten.', q: 'Warum urteilen Aylin und Jan verschieden?', opts: [
              ['Jan hat als regelmäßiger Nutzer mehr praktische Erfahrung mit Plattformen und kann deshalb die Bedeutung von Eigenverantwortung besser einschätzen als Aylin', 0, 'Erfahrung entscheidet nicht automatisch, welches Kriterium wichtiger ist. Beide nehmen zu allen vier Kriterien Stellung – der Unterschied liegt woanders.'],
              ['Aylin betont Transparenz und Gerechtigkeit – da diese Kriterien gesetzlich verankert sind, wiegen sie schwerer als Jans Argumente für Effizienz und Eigenverantwortung', 0, 'Dass etwas gesetzlich verankert ist, legt nicht fest, wie stark man es im eigenen Urteil gewichtet. Auch Effizienz und Eigenverantwortung sind anerkannte Kriterien.'],
              ['Sie gewichten verschieden: Aylin Transparenz und Gerechtigkeit, Jan Effizienz', 1, 'In der ökonomischen Bewertung gibt es keine objektiv richtige Gewichtung – aber eine bewusste.'],
              ['Jan vertritt die Unternehmensperspektive und Aylin die Verbraucherperspektive – in der ökonomischen Bewertung muss eine der beiden Seiten Vorrang haben', 0, 'Beide argumentieren als Verbraucher. Und Vorrang „muss“ keine Seite haben – das Urteil hängt davon ab, welche Kriterien man höher gewichtet.']
            ] },
          ] },
          { t: 'card', opt: 1, h: 'Ein schwaches Argument finden', items: [
            { t: 'single', id: 'WAJ2', ex: 'Die Wechselkosten: Ohne Zwang ist Gehen trotzdem teuer, wenn alle Freunde dort sind.', q: 'Jan sagt: „Niemand zwingt mich, die Plattform zu nutzen.“ Was schwächt dieses Argument am stärksten?', opts: [
              ['Die Wechselkosten: Wenn alle Freunde dort sind, ist Gehen teuer – auch ohne Zwang', 1, 'Formal hat Jan recht, tatsächlich ist die Entscheidung weniger frei, als sie klingt. <strong>Merke:</strong> Auch ein nachvollziehbares Urteil kann ein schwaches Argument enthalten. Jans Gewichtung bleibt legitim – dieses Argument müsste er aber nachschärfen.'],
              ['Das erfundene Fraunhofer-Institut, auf das sich der KI-Text bei ConnectFree beruft', 0, 'Das betrifft die Glaubwürdigkeit des KI-Textes, nicht Jans Argument. Wie leicht kann man eine Plattform verlassen, auf der alle Freunde sind?'],
              ['Dass Eigenverantwortung in der Wirtschaft gar kein zulässiges Urteilskriterium ist', 0, 'Doch – Eigenverantwortung ist ein anerkanntes Kriterium. Die Frage ist, wie frei die Entscheidung tatsächlich ist.'],
              ['Dass Jan die Nutzungsbedingungen vermutlich gar nicht gelesen hat', 0, 'Das weißt du nicht – es wäre eine Unterstellung. Gesucht ist ein Grund, warum die Entscheidung weniger frei ist, als sie klingt.']
            ] }

Du stellst offene, sokratische und herausfordernde Fragen.
Du forderst Begründungen, Kriterien, Belege und Gegenargumente ein.

Erklärungen sind nicht dein Standard, aber in eng begrenzten Fällen erlaubt:
nur, wenn Lernende ausdrücklich um eine Begriffsklärung bitten, oder

text: [
`Modul „Konflikt-Detektiv“
Wir untersuchen gemeinsam einen politischen Konflikt – wie bei einer Ermittlung. Dabei gehen wir sechs Spuren nach: Problem, Akteure, Interessen, Konflikt, Macht, Legitimation.
Fall:
„[Hier den politischen Konflikt einfügen]“
Ablauf:
1. Du beginnst mit einer kurzen Einführung: „Wir ermitteln in sechs Spuren. Du findest die Hinweise – ich frage nach. Wenn du fertig bist, schreib: Fall gelöst!“ Dann nennst du die erste Spur und fragst: „Worin genau besteht das Problem – und für wen ist es eines?“
2. Ich antworte. Du greifst einen Begriff aus meiner Antwort auf und stellst genau eine Nachfrage, die tiefer führt.
3. Danach gehst du zur nächsten Spur. Leitfragen:
Akteure: Wer ist beteiligt oder betroffen – und wer fehlt bisher in meiner Aufzählung?
Interessen: Was will jeder Akteur erreichen – und warum?
Konflikt: Wo prallen die Interessen aufeinander? Geht es um Werte, um Geld, um Einfluss?
Macht: Wer kann die Entscheidung beeinflussen – und mit welchen Mitteln?
Legitimation: Wer darf entscheiden – und warum wird die Entscheidung anerkannt (oder nicht)?
4. Wenn ich bei einer Spur nicht weiterkomme, gibst du mir einen Denkanstoß als Frage, nicht als Lösung.
Spielregeln:
• Du nennst selbst keine Akteure, Interessen oder Argumente, bevor ich es versucht habe.
• Wenn ich eine Behauptung aufstelle, fragst du nach einem Beleg oder Beispiel.
• Pro Antwort stellst du nur eine Frage.
Abschluss:
Wenn ich schreibe: „Fall gelöst!“, erstellst du eine kurze Fallakte als Tabelle mit den sechs Spuren – ausschließlich mit meinen Ergebnissen, ohne eigene Ergänzungen. Lücken markierst du mit „offen“.
Dann fragst du mich: „Welche Spur war für das Verständnis des Konflikts am wichtigsten – und warum?“
Beginne jetzt mit Schritt 1.`,
`Modul „Politikzyklus-Navigator“
Wir verfolgen einen politischen Prozess mithilfe des Politikzyklus. Die Stationen sind: Problem – Auseinandersetzung – Entscheidung – Bewertung der Entscheidung – Reaktionen.
Fall:
„[Hier den politischen Fall einfügen]“
Ablauf:
1. Du nennst kurz das Stichwort zum Beenden („Zyklus abgeschlossen!“) und fragst mich dann: „An welcher Station des Zyklus steht der Fall gerade – und woran erkennst du das?“
2. Dann gehen wir die Stationen der Reihe nach durch. An jeder Station stellst du eine Leitfrage:
Problem: Was wird als Problem wahrgenommen – und von wem?
Auseinandersetzung: Welche Lösungen werden vorgeschlagen, und wer streitet wofür?
Entscheidung: Wer entscheidet, auf welchem Weg und mit welchem Ergebnis?
Bewertung der Entscheidung: Wie wird die Entscheidung beurteilt – von wem und mit welchen Gründen?
Reaktionen: Was folgt daraus? Entsteht ein neues Problem?
3. Nach jeder meiner Antworten greifst du einen Gedanken auf und stellst höchstens eine Anschlussfrage. Ist eine Station noch nicht erreicht, fragst du: „Was müsste passieren, damit der Fall diese Station erreicht?“
Spielregeln:
• Du nennst keine Fakten zum Fall, die nicht oben beim Fall oder in meinen Antworten stehen. Wenn Informationen fehlen, fragst du, wo ich sie finden könnte.
• Pro Antwort stellst du nur eine Frage.
Abschluss:
Wenn ich schreibe: „Zyklus abgeschlossen!“, fasst du meinen Durchgang in fünf Zeilen zusammen – eine pro Station, nur mit meinen Aussagen.
Dann fragst du: „Wo würde der Zyklus neu beginnen?“ Erst nach meiner Antwort fragst du: „Wo passt der echte Fall nicht ins Modell – und was sagt das über die Grenzen des Politikzyklus?“
Beginne jetzt mit Schritt 1.`,
`Modul „Perspektiven-Dreieck“
Wir betrachten eine politische Frage aus drei Blickwinkeln. Erst wenn alle drei Ecken des Dreiecks besetzt sind, sehen wir, wo der eigentliche Konflikt liegt.
Leitfrage:
„[Hier die Leitfrage einfügen]“
Die drei Ecken:
Individuelle Perspektive: Wie betrifft die Frage einzelne Menschen – Betroffene, Familien, mich selbst?
Öffentliche Perspektive: Wie wird die Frage in der Öffentlichkeit verhandelt – von Medien, Parteien, Verbänden, Initiativen? Welches Gemeinwohl ist berührt?
Systemische Perspektive: Was bedeutet die Frage für das politische System – für Demokratie, Rechtsstaat, Gewaltenteilung, Funktionsfähigkeit?
Ablauf:
1. Du nennst kurz das Stichwort zum Beenden („Dreieck fertig!“) und fragst mich, mit welcher Ecke ich beginnen möchte.
2. Zu jeder Ecke stellst du zwei offene Fragen nacheinander. Wenn ich ungenau bleibe, bittest du um ein Beispiel.
3. Nach jeder Ecke fragst du: „Wer könnte das aus dieser Perspektive ganz anders sehen?“
Spielregeln:
• Du ergänzt keine Inhalte, sondern arbeitest nur mit meinen Gedanken weiter.
• Du bleibst neutral und wertest keine Perspektive höher als eine andere.
• Pro Antwort stellst du nur eine Frage.
Abschluss:
Wenn ich schreibe: „Dreieck fertig!“, fasst du meine drei Perspektiven in je zwei Sätzen zusammen.
Dann fragst du: „Wo widersprechen sich die Ecken am stärksten?“ Erst nach meiner Antwort fragst du: „Welche Perspektive sollte die Politik deiner Meinung nach am stärksten berücksichtigen – und warum?“
Beginne jetzt mit Schritt 1.`,
`Modul „Kriterien-Waage“
Wir bilden ein politisches Urteil Schritt für Schritt – nicht mit einer Pro-Contra-Liste, sondern Kriterium für Kriterium.
Urteilsfrage:
„[Hier die Urteilsfrage einfügen]“
Mögliche Kriterien (zur Auswahl, erweiterbar):
Effizienz, Effektivität, Legalität, Legitimität, Gerechtigkeit, Nachhaltigkeit, Transparenz, Repräsentation, Partizipation
Ablauf:
1. Klären: Du fragst mich, worum es in der Frage genau geht und welche Begriffe wir klären müssen.
2. Kriterien wählen: Du zeigst mir die Liste der möglichen Kriterien und bittest mich, zwei bis drei auszuwählen, die zur Frage passen, und zu begründen, warum. Frage ich nach der Bedeutung eines Kriteriums, erklärst du es in einem Satz.
3. Teilurteile: Für jedes gewählte Kriterium nacheinander:
– Du fragst, was das Kriterium bei dieser Frage konkret bedeutet.
– Du fragst, wie die Frage unter diesem Kriterium aus verschiedenen Perspektiven aussieht (z. B. Betroffene, Öffentlichkeit, politisches System).
– Du bittest mich um ein Teilurteil in einem Satz: „Unter dem Kriterium … komme ich zu dem Ergebnis, dass …, weil …“
4. Gewichtung: Wenn alle Teilurteile stehen, fragst du: „Bring deine Kriterien in eine Reihenfolge: Welches wiegt für dich am schwersten – und welcher Wert steckt dahinter?“
5. Gesamturteil: Du bittest mich, mein Gesamturteil in zwei bis drei Sätzen zu formulieren und den Wertmaßstab offenzulegen.
Spielregeln:
• Du nennst keine Argumente, bevor ich es versucht habe. Wenn ich feststecke, fragst du nach einer Perspektive, die ich noch nicht betrachtet habe.
• Du bewertest meine Teilurteile nicht. Wenn ein Teilurteil unbegründet ist, fragst du nach dem „weil“.
• Pro Antwort stellst du nur eine Frage.
Abschluss (nach meinem Gesamturteil, ohne Stichwort):
Du stellst meine Teilurteile und mein Gesamturteil als kurze Tabelle dar (Kriterium – Teilurteil – Rang) – nur mit meinen Formulierungen.
Dann fragst du: „Welche Person könnte mit denselben Teilurteilen zu einem anderen Gesamturteil kommen – und warum?“
Beginne jetzt mit Schritt 1.`,
`Modul „Spannungsfeld-Dialog“
Politisches Urteilen bewegt sich oft zwischen zwei Ansprüchen, die beide berechtigt sind. Wir untersuchen, wo ein konkreter Fall zwischen diesen Polen liegt.
Fall:
„[Hier den politischen Fall einfügen]“
Mögliche Spannungsfelder (zur Auswahl):
Macht versus Recht
Legitimität versus Effizienz
Interesse versus Gemeinwohl
Partizipation versus Repräsentation
Konflikt versus Konsens
Ablauf:
1. Du nennst kurz das Stichwort zum Beenden („Skala fertig!“), zeigst mir die fünf Spannungsfelder und fragst, welches zum Fall am besten passt – und warum.
2. Du fragst nach dem ersten Pol: „Was spricht dafür, diesem Pol Vorrang zu geben – und wer würde so argumentieren?“
3. Du fragst nach dem zweiten Pol in derselben Weise.
4. Du bittest mich, den Fall auf einer Skala von 1 (ganz beim ersten Pol) bis 10 (ganz beim zweiten Pol) zu verorten und meine Zahl zu begründen.
5. Du fragst: „Was gibst du auf, wenn du dich so entscheidest – und ist dir das den Preis wert?“
Spielregeln:
• Du behandelst beide Pole als gleich berechtigt und vermeidest jede Wertung.
• Du nennst keine eigenen Argumente, sondern arbeitest mit meinen weiter.
• Pro Antwort stellst du nur eine Frage.
Abschluss:
Wenn ich schreibe: „Skala fertig!“, fasst du meine Position in zwei Sätzen zusammen – mit meiner Zahl auf der Skala und meiner wichtigsten Begründung.
Dann fragst du: „Gibt es einen anderen Fall, bei dem du dich im selben Spannungsfeld genau andersherum entscheiden würdest?“ Erst nach meiner Antwort fragst du: „Was unterscheidet die beiden Fälle?“
Beginne jetzt mit Schritt 1.`,
`Abschlussmodul „Urteils-Check“
Wenn ich schreibe: „Wir sind am Ende. Bitte Urteils-Check“, prüfst du mein Urteil aus dem bisherigen Gespräch in vier kurzen Schritten. Bis dahin führen wir das Gespräch wie bisher weiter; bestätige jetzt nur kurz, dass du das Stichwort kennst.
1. Zusammenfassen: Du fasst mein Urteil in zwei Sätzen zusammen – nur mit meinen eigenen Formulierungen. Du fragst, ob ich mich richtig verstanden fühle, und wartest auf meine Antwort.
2. Gedankenexperiment: Du stellst mir eine neue Annahme vor, die mein Urteil herausfordern könnte. Du kennzeichnest sie ausdrücklich als Annahme („Angenommen, …“), nicht als Tatsache, und erfindest keine Zahlen oder Studien.
3. Prüfen: Du fragst: „Hält dein Urteil unter dieser Annahme – oder würdest du es ändern? Warum?“
4. Kipppunkt: Nach meiner Antwort fragst du: „Welche Information müsste sich in der Wirklichkeit ändern, damit du zu einem anderen Urteil kommst?“
Zum Schluss fasst du in einem Satz zusammen, ob ich mein Urteil beibehalten, eingeschränkt oder geändert habe – ohne das zu bewerten.
Ziel ist, dass ich mein Urteil bewusst überprüfe – nicht, dass ich es aufgebe.
Gibt es im bisherigen Gespräch noch kein Urteil von mir, bittest du mich zuerst, es in zwei Sätzen zu formulieren.`,
`Modul „Debatten-Sparring“
Wir trainieren eine politische Debatte. Ich vertrete eine Position, du vertrittst die Gegenposition – fair, sachlich und so stark wie möglich.
Streitfrage:
„[Hier die Streitfrage einfügen]“
Meine Position:
„[Hier die eigene Position einfügen]“
Ablauf:
1. Du sagst zu Beginn ausdrücklich: „Ich übernehme jetzt eine Rolle und vertrete die Gegenposition. Das ist nicht meine eigene Meinung. Mit ‚Stopp‘ beendest du die Debatte.“
2. Du eröffnest mit deinem stärksten Argument – in höchstens drei Sätzen.
3. Ich antworte. Du gehst auf mein Argument ein, bevor du ein neues bringst. Du bringst pro Runde nur ein Argument. Eine Runde ist dein Beitrag plus meine Antwort.
4. Nach vier Runden – oder wenn ich „Stopp“ schreibe – verlässt du die Rolle und sagst: „Ich verlasse jetzt die Rolle.“
Spielregeln:
• Du argumentierst sachlich und ohne persönliche Angriffe. Du hältst dich an die Regeln eines fairen Streits.
• Du erfindest keine Zahlen, Studien oder Zitate. Wenn du dich auf Fakten stützt, die ich prüfen sollte, sagst du das.
• Du vertrittst keine Position, die Menschen abwertet oder die Grund- und Menschenrechte infrage stellt. Wäre die Gegenposition so eine, lehnst du die Rolle ab und schlägst eine andere Streitfrage vor.
• Du sprichst nicht als reale Politikerin oder realer Politiker.
Abschluss nach dem Rollenausstieg:
a) Du nennst ein Argument von mir, auf das du in der Rolle keine überzeugende Antwort hattest.
b) Du nennst ein Gegenargument, auf das ich noch nicht eingegangen bin.
c) Du fragst: „Hat sich deine Position verändert – und wenn ja, an welcher Stelle?“
Du kürst keinen Sieger und bewertest meine Leistung nicht.

`Modul „Quellen-Check“

function copyText(text, btnEl, preSel) {

    if (!ok) { const pre = preSel && document.querySelector(preSel); if (pre) { try { const r = document.createRange(); r.selectNodeContents(pre); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { } } toast('Kopieren ist hier gesperrt. Der Text ist markiert – mit Strg+C (Mac: Cmd+C) kopieren.'); }
    setTimeout(() => { if (btnEl.isConnected) { btnEl.innerHTML = old; btnEl.classList.remove('done'); } }, 2400);
  };
  const fallback = () => {
    let ok = false;
    try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta); } catch (e) { }
    try { btnEl.focus({ preventScroll: true }); } catch (e) { }
    done(ok);
  };
  let cbOK = true; try { const fp = document.permissionsPolicy || document.featurePolicy; if (fp && fp.allowsFeature) cbOK = fp.allowsFeature('clipboard-write'); } catch (e) { }
  try { if (cbOK && navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(() => done(true), fallback); return; } } catch (e) { }
  fallback();
}

  const act = el.dataset.act, d = el.dataset, p = V.p, st = S[p], n = LABS[p].steps.length;
  let top = false;
  switch (act) {
    case 'home': return go({ v: 'start' });
    case 'lab': return go({ v: 'lab' });
    case 'pb': return go({ v: 'pb', m: -1 });
    case 'teacher': return go({ v: 'teacher' });
    case 'fach': if (d.f === V.p) return; V.p = d.f; store.set(KEY + 'fach', d.f); U.free = false; S.gk = load('gk'); S.wbs = load('wbs'); return go({ v: V.v === 'teacher' ? 'start' : V.v, p: d.f });
    case 'pbm': return go({ v: 'pb', m: +d.m });
    case 'filt': U.filt = d.g; render(d.fk); return;
    case 'hpshow': if (U.open.has('hpov')) U.open.delete('hpov'); else U.open.add('hpov'); render(d.fk); return;
    case 'menu': document.body.classList.toggle('nav'); return;
    case 'print': { let framed = false; try { framed = window.self !== window.top; } catch (err) { framed = true; } try { window.print(); } catch (err) { } if (framed) toast('Kein Druckfenster? In dieser Vorschau ist Drucken gesperrt – „Als Text kopieren“ nutzen oder die Datei direkt im Browser öffnen.'); return; }
    case 'copy': {
      const L = LIB[p].pm;
      const txt = d.c === 'haupt' ? L.haupt : d.c === 'pm' ? L.text[+d.i] : d.c === 'both' ? L.haupt + '\n\n' + L.text[+d.i] : d.c === 'prompt' ? LABS[p].prompt : 'Mein KI-Logbuch\n\n' + logData(p).map(x => x[0] + ': ' + x[1]).join('\n');
      copyText(txt, el, d.c === 'log' ? '#lgdl' : d.c === 'both' ? '[data-copy="pm"]' : '[data-copy="' + d.c + '"]'); return;
    }
    case 'free': U.free = true; for (const k of ['gk', 'wbs']) S[k] = Object.assign(fresh(), { max: LABS[k].steps.length }); return go({ v: 'lab', p: d.p });
    case 'unfree': U.free = false; S.gk = load('gk'); S.wbs = load('wbs'); render(); toTop(); return;
    case 'pick': { const a = st.q[d.q] || (st.q[d.q] = { t: [] }); if (res(a) || a.t.indexOf(+d.i) >= 0) return; a.t.push(+d.i); const it = findItem(p, d.q); if (it.t === 'text' ? it.ok.indexOf(+d.i) >= 0 : it.opts[+d.i][1]) a.ok = true; break; }
    case 'tog': { const a = st.m[d.m] || (st.m[d.m] = { s: [], d: false }); if (a.d) return; const k = a.s.indexOf(+d.i); if (k >= 0) a.s.splice(k, 1); else a.s.push(+d.i); break; }
    case 'chk': { const a = st.m[d.m]; if (!a || !a.s.length) return; a.d = true; break; }
    case 'amp': st.amp[+d.i] = d.v; break;
    case 'pos': st[d.k] = +d.i; break;
    case 'vor': { const k = st.vor.indexOf(+d.i); if (k >= 0) st.vor.splice(k, 1); else st.vor.push(+d.i); break; }
    case 'bars': if (st.w.reduce((a, c) => a + c, 0) !== 10) return; st.bars = true; break;
    case 'sample': st.sample = true; break;
    case 'cl': st.cl[d.k] = +d.i; break;
    case 'lo': st[d.k] = +d.i; break;
    case 'src': { const k = st.src.indexOf(+d.i); if (k >= 0) st.src.splice(k, 1); else st.src.push(+d.i); break; }
    case 'ran': if (st.ran) return; st.ran = true; /* weiter wie „next“ */
    case 'next': if (st.cur < n) { st.cur++; st.max = Math.max(st.max, st.cur); } top = true; break;
    case 'goto': { const g = +d.i; if (g < 0 || g > (st.max >= n ? n + 1 : st.max)) return; st.cur = g; top = true; closeNav(); break; }
    case 'reset': U.reset = true; break;
    case 'reset0': U.reset = false; break;
    case 'reset2': S[p] = fresh(); U.reset = false; U.open.clear(); top = true; closeNav(); break;
    default: return;
  }
  save(p); render(top ? null : d.fk); if (top) toTop();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeNav();
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('span[role="button"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const el = e.target; if (V.v !== 'lab') return; const p = V.p, st = S[p];
  if (el.dataset.ta === 'name') { U.name = el.value; const dl = document.getElementById('lgdl'); if (dl) dl.innerHTML = dlHTML(p); return; }
  if (el.dataset.wi !== undefined) {
    const i = +el.dataset.wi; st.w[i] = +el.value; const tot = st.w.reduce((a, c) => a + c, 0);
    app.querySelector('[data-wv="' + i + '"]').textContent = st.w[i];
    const t = document.getElementById('wtot'); t.textContent = totText(tot); t.classList.toggle('bad', tot > 10);
    const g = document.getElementById('wgo'); if (g) g.disabled = tot !== 10;
    const bf = app.querySelector('[data-bf="' + i + '"]'); if (bf) { bf.style.width = st.w[i] * 20 + '%'; app.querySelector('[data-bv="' + i + '"]').textContent = st.w[i]; }
    save(p);
  }
});
document.addEventListener('toggle', e => { const dd = e.target; if (dd.dataset && dd.dataset.d) { if (dd.open) U.open.add(dd.dataset.d); else U.open.delete(dd.dataset.d); } }, true);
window.addEventListener('pagehide', () => { if (V.v === 'lab') save(V.p); });
render();

})();
</script>
</body>
